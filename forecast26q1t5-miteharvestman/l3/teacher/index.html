<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Value of Research into Mite Harvestmen — IELTS teacher page</title>
<meta name="description" content="IELTS Forecast 2026 Quarter 1 · Test 5 · Passage 3. Read, learn the key words, then answer all 14 questions.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* Worksheet — screen styles (bright). Print styles live in print.css. */
:root {
  color-scheme: light;
  --ink: #1f2a37; --muted: #5b6675; --line: #e6e1d6; --paper: #fffdf8; --card: #ffffff;
  --sky: #1e88e5;   --sky-t: #e8f3fd;
  --sun: #f08c00;   --sun-t: #fff3e0;
  --leaf: #17a34a;  --leaf-t: #e7f7ec;
  --berry: #d6336c; --berry-t: #fde8ef;
  --violet: #7048e8; --violet-t: #efeafd;
  --bad: #e03131;   --bad-t: #fdecec;
  --hl: #ffe066;
  --body: 'Nunito', system-ui, sans-serif;
  --hand: 'Patrick Hand', 'Caveat', cursive;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 var(--body); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--sky); }
.print-only { display: none; }

/* ---------- header ---------- */
.hero { position: relative; overflow: hidden; background: linear-gradient(120deg, #fff6d8, #e6f6ff 55%, #f0ffe9); border-bottom: 3px solid var(--ink); }
.hero-in { max-width: 1280px; margin: 0 auto; padding: 28px 20px 24px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; position: relative; z-index: 1; }
.hero-img { position: absolute; inset: 0 0 0 auto; width: min(52%, 620px); background-size: cover; background-position: center; -webkit-mask-image: linear-gradient(90deg, transparent, #000 45%); mask-image: linear-gradient(90deg, transparent, #000 45%); }
.badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.badge { display: inline-block; padding: 2px 12px; border: 2px solid var(--ink); border-radius: 999px; font-weight: 800; font-size: 14px; background: #fff; }
.badge.lv { color: #fff; border-color: transparent; }
.lv-L1_A2 .badge.lv { background: var(--leaf); }
.lv-L2_B1 .badge.lv { background: var(--sky); }
.lv-L3_IELTS .badge.lv { background: var(--violet); }
h1 { font: 400 clamp(34px, 6vw, 56px)/1.05 var(--hand); margin: 0 0 6px; max-width: 16ch; }
.sub { margin: 0; color: var(--muted); font-weight: 700; max-width: 52ch; }
.series { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.series a, .series span { font-size: 14px; font-weight: 800; padding: 3px 10px; border-radius: 8px; text-decoration: none; border: 2px dashed var(--muted); color: var(--muted); background: rgba(255,255,255,.75); }
.series span.cur { border-style: solid; border-color: var(--ink); color: var(--ink); background: #fff; }
.links { display: flex; gap: 14px; align-items: center; background: rgba(255,255,255,.9); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px; }
.links .qr { width: 92px; height: 92px; display: grid; place-items: center; }
.links .qr svg, .links .qr img { width: 100%; height: 100%; }
.links .qr:empty { display: none; }
.links p { margin: 0; font-size: 14px; font-weight: 700; max-width: 26ch; overflow-wrap: anywhere; }
.links:not(:has(a)) { display: none; }

/* ---------- toolbar ---------- */
.toolbar { position: sticky; top: 0; z-index: 20; background: var(--ink); color: #fff; }
.tb-in { max-width: 1280px; margin: 0 auto; padding: 8px 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 4px 12px; border-radius: 999px; font-weight: 800; font-size: 14px; background: rgba(255,255,255,.12); }
.chip b { color: var(--hl); }
.tb-in .grow { flex: 1; }
.tbtn { border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 14px; background: #fff; color: var(--ink); }
.tbtn.ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.5); }
.tbtn.timer.run { background: var(--hl); }
.tbtn.timer.out { background: var(--bad); color: #fff; }
.printbox { position: relative; }
.printbox summary { list-style: none; }
.printbox summary::-webkit-details-marker { display: none; }
.printpanel { position: absolute; right: 0; top: calc(100% + 8px); background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: 14px; padding: 14px; width: 260px; box-shadow: 0 12px 30px rgba(0,0,0,.2); }
.printpanel fieldset { border: 0; margin: 0 0 10px; padding: 0; }
.printpanel legend { font-weight: 800; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.printpanel label { display: flex; gap: 8px; align-items: center; font-size: 15px; padding: 2px 0; }
.printpanel .tbtn { width: 100%; background: var(--ink); color: #fff; margin-top: 4px; }
.banner { background: var(--hl); color: var(--ink); text-align: center; font-weight: 800; padding: 6px 12px; font-size: 15px; }

/* ---------- layout ---------- */
.layout { max-width: 1280px; margin: 0 auto; padding: 20px; display: grid; gap: 20px; }
@media (min-width: 1060px) {
  .layout { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
  .read { position: sticky; top: 64px; max-height: calc(100vh - 84px); overflow: auto; }
}
.card { background: var(--card); border: 2px solid var(--ink); border-radius: 18px; padding: 18px 20px 20px; box-shadow: 5px 5px 0 var(--acc, var(--ink)); --acc: var(--sky); --tint: var(--sky-t); }
.work { display: grid; gap: 20px; min-width: 0; }
.card h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; font: 400 32px/1.1 var(--hand); }
.card h2 .num { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--acc); color: #fff; font: 800 18px var(--body); flex: none; }
.card .hint { margin: 0 0 14px; color: var(--muted); font-size: 15px; font-weight: 600; }
.read { --acc: var(--sky); --tint: var(--sky-t); }
.vocab { --acc: var(--sun); --tint: var(--sun-t); }
.para { --acc: var(--berry); --tint: var(--berry-t); }
.qs { --acc: var(--leaf); --tint: var(--leaf-t); }
.done { --acc: var(--violet); --tint: var(--violet-t); }

/* ---------- passage ---------- */
.passage h3 { font: 800 15px var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--acc); margin: 18px 0 6px; }
.passage h3:first-child { margin-top: 4px; }
.passage p { margin: 0 0 12px; line-height: 1.85; letter-spacing: .015em; word-spacing: .06em; position: relative; padding-left: 30px; }
.passage p .pn { position: absolute; left: 0; top: 4px; width: 22px; height: 22px; border-radius: 6px; background: var(--tint); color: var(--acc); font-size: 12px; font-weight: 800; display: grid; place-items: center; line-height: 1; }
.passage .ck { border-radius: 4px; transition: background .4s; }
.passage .ck.flash { background: var(--sky-t); outline: 2px dashed var(--sky); }
mark.ev { background: none; color: inherit; border-radius: 3px; }
mark.ev.on { background: var(--hl); box-shadow: 0 0 0 2px var(--hl); }
.vw.on { background: var(--sun-t); outline: 2px solid var(--sun); border-radius: 3px; }
.pp.on { background: var(--berry-t); outline: 2px solid var(--berry); border-radius: 3px; }
.copy { font-size: 13px; color: var(--muted); margin: 14px 0 0; }

/* ---------- vocab ---------- */
.match { display: grid; gap: 18px; }
@media (min-width: 640px) { .match { grid-template-columns: 0.9fr 1.1fr; } }
.words, .defs { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.words li { display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 12px; background: var(--tint); }
.words .w { font-weight: 800; flex: 1; }
.words .pos { font-size: 13px; color: var(--muted); font-weight: 700; }
.words select { width: 58px; height: 38px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; text-align: center; font-weight: 800; }
.words li.ok { background: var(--leaf-t); }
.words li.ok select { border-color: var(--leaf); color: var(--leaf); }
.words li.no select { border-color: var(--bad); color: var(--bad); }
.mk { width: 22px; font-weight: 800; text-align: center; }
.ok > .mk::after, .ok .mk::after { content: '✓'; color: var(--leaf); }
.no > .mk::after, .no .mk::after { content: '✗'; color: var(--bad); }
.defs li { display: flex; gap: 10px; font-size: 15px; line-height: 1.45; }
.defs .lt { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--acc); color: var(--acc); font-weight: 800; display: grid; place-items: center; font-size: 14px; }
.see { border: 0; background: none; padding: 0; color: var(--acc); font-weight: 800; font-size: 13px; text-decoration: underline; }

/* ---------- paraphrase ---------- */
.pp-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.pp-list li { padding: 10px 12px; border-radius: 12px; background: var(--tint); }
.pp-q { font-weight: 800; }
.pp-q::before { content: '“'; } .pp-q::after { content: '”'; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.row input { flex: 1 1 200px; min-width: 0; height: 40px; border: 2px solid var(--ink); border-radius: 10px; padding: 0 12px; background: #fff; }
.btn { height: 40px; border: 2px solid var(--ink); border-radius: 10px; padding: 0 14px; font-weight: 800; background: #fff; }
.btn.go { background: var(--acc); color: #fff; border-color: var(--acc); }
.fbs { font-size: 15px; margin-top: 6px; font-weight: 700; }
.ok .fbs { color: var(--leaf); } .no .fbs { color: var(--bad); }
.ok input { border-color: var(--leaf); background: var(--leaf-t); }
.no input { border-color: var(--bad); }

/* ---------- questions ---------- */
.set { margin-top: 8px; }
.set + .set { margin-top: 26px; }
.set h3 { font: 800 18px var(--body); margin: 0 0 4px; }
.instr { font-size: 15px; color: var(--muted); margin: 0 0 12px; }
.instr b { color: var(--ink); }
.q { padding: 12px 14px; border-radius: 14px; border: 2px solid transparent; background: var(--tint); margin-bottom: 10px; }
.q.ok { border-color: var(--leaf); background: #fff; }
.q.no { border-color: var(--bad); background: #fff; }
.q .qt { display: flex; gap: 10px; }
.qn { flex: none; display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 9px; background: var(--ink); color: #fff; font-weight: 800; font-size: 15px; }
.tf { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0 40px; align-items: center; }
.tf label { position: relative; }
.tf input { position: absolute; opacity: 0; inset: 0; }
.tf span { display: inline-block; padding: 5px 14px; border: 2px solid var(--ink); border-radius: 999px; font-weight: 800; font-size: 14px; background: #fff; }
.tf input:checked + span { background: var(--ink); color: #fff; }
.tf input:focus-visible + span { outline: 3px solid var(--sky); outline-offset: 2px; }
.tfbox { display: none; }
.notes { border: 2px dashed var(--acc); border-radius: 14px; padding: 14px 16px; background: #fff; }
.notes h4 { text-align: center; font: 400 26px var(--hand); margin: 0 0 6px; }
.notes h5 { font: 800 15px var(--body); margin: 14px 0 6px; color: var(--acc); }
.notes .info { margin: 0 0 8px 18px; }
.notes .q { background: none; padding: 6px 8px; margin: 0 0 6px; }
.notes .qt { align-items: baseline; }
.notes .qt::before { content: '•'; font-weight: 800; color: var(--acc); }
.gap { display: inline-flex; align-items: baseline; gap: 4px; }
.gap .qn { min-width: 26px; height: 26px; font-size: 13px; transform: translateY(-1px); }
.gap input { width: 150px; max-width: 46vw; height: 34px; border: 0; border-bottom: 3px dotted var(--ink); background: var(--sun-t); border-radius: 6px 6px 0 0; padding: 0 8px; font-weight: 800; }
.q.ok .gap input { background: var(--leaf-t); border-bottom-color: var(--leaf); }
.q.no .gap input { background: var(--bad-t); border-bottom-color: var(--bad); }
.qact { display: flex; gap: 8px; margin: 8px 0 0 40px; }
.qact .btn { height: 32px; font-size: 14px; padding: 0 12px; }
.fb { margin: 10px 0 0 40px; font-size: 15px; line-height: 1.5; }
.fb:empty { display: none; }
.fb .res { font-weight: 800; margin: 0 0 4px; }
.q.ok .res { color: var(--leaf); } .q.no .res { color: var(--bad); }
.fb p, .fb ul { margin: 0 0 6px; }
.fb ul { padding-left: 18px; }
.tag { display: inline-block; font-size: 12px; font-weight: 800; padding: 1px 8px; border-radius: 6px; color: #fff; margin-right: 4px; }
.tag.loc { background: var(--leaf); } .tag.dec { background: var(--sun); } .tag.trap { background: var(--bad); } .tag.tip { background: var(--violet); }
.setact { display: flex; gap: 8px; justify-content: flex-end; }

/* ---------- done ---------- */
.score { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 14px; }
.score div { flex: 1 1 140px; text-align: center; padding: 12px; border-radius: 14px; background: var(--tint); font-weight: 800; }
.score b { display: block; font: 400 40px/1 var(--hand); color: var(--acc); }
.doneact { display: flex; flex-wrap: wrap; gap: 8px; }
.msg { font-weight: 700; color: var(--muted); }
.key { display: none; }
footer { max-width: 1280px; margin: 0 auto; padding: 8px 20px 40px; font-size: 13px; color: var(--muted); }
footer p { margin: 4px 0; }
@media (max-width: 640px) {
  body { font-size: 16px; }
  .hero-in { grid-template-columns: 1fr; padding-top: 22px; }
  .hero-img { width: 100%; opacity: .22; }
  .layout { padding: 16px; }
  .card { padding: 16px; }
  .tf, .qact, .fb { margin-left: 0; }
  .tb-in { padding: 6px 16px; gap: 6px; }
  .chip { padding: 2px 9px; font-size: 13px; }
  .tbtn { padding: 4px 11px; font-size: 13px; }
  .tb-in .grow { display: none; }
}
.mc { display: grid; gap: 6px; margin: 10px 0 0 40px; }
.mc label { position: relative; display: block; }
.mc input { position: absolute; opacity: 0; inset: 0; }
.mc span { display: block; padding: 8px 14px; border: 2px solid var(--ink); border-radius: 14px; font-size: 15px; background: #fff; }
.mc.row { display: flex; flex-wrap: wrap; gap: 8px; }
.mc.row span { padding: 8px 16px; }
.mc input:checked + span { background: var(--ink); color: #fff; }
.bank { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 8px 0 12px; padding: 10px 14px; border: 2px dashed var(--ink); border-radius: 14px; font-weight: 700; }

/* ---------- modes: student (site/s) · teacher (site/t) ---------- */
.who { --acc: var(--berry); --tint: var(--berry-t); }
.whorow { display: flex; flex-wrap: wrap; gap: 12px; }
.whorow label, .lbl { display: grid; gap: 4px; font-weight: 800; font-size: 14px; color: var(--muted); flex: 1 1 180px; }
.whorow input, .lbl input { height: 40px; border: 2px solid var(--ink); border-radius: 10px; padding: 0 12px; background: #fff; color: var(--ink); font-weight: 700; font-size: 16px; }
.sublink { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--tint); }
.sublink p { margin: 0 0 4px; }
.locked .work input, .locked .work select { opacity: 1; cursor: default; }
.badge.tea { background: var(--ink); color: #fff; border-color: var(--ink); }
.banner.tea { background: var(--violet-t); }
.banner.view { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; background: var(--sun-t); }
.teach { background: var(--violet-t); border-bottom: 3px solid var(--ink); }
.teach-in { max-width: 1280px; margin: 0 auto; padding: 20px; display: grid; gap: 20px; }
@media (min-width: 1060px) { .teach-in { grid-template-columns: minmax(0, .8fr) minmax(0, 1.6fr); align-items: start; } }
.assign { --acc: var(--violet); --tint: var(--violet-t); display: grid; gap: 10px; }
.assign .hint { margin: 0; }
.asqr { width: 150px; height: 150px; }
.asqr svg { width: 100%; height: 100%; }
.asqr:empty { display: none; }
.btn.lnk { display: inline-grid; place-items: center; text-decoration: none; color: var(--ink); }
.results { --acc: var(--violet); --tint: var(--violet-t); min-width: 0; }
.results textarea { width: 100%; border: 2px solid var(--ink); border-radius: 10px; padding: 8px 12px; font: 14px/1.4 var(--body); resize: vertical; margin-bottom: 8px; }
.results .doneact { align-items: center; }
.results .grow { flex: 1; }
.results select { height: 40px; border: 2px solid var(--ink); border-radius: 10px; padding: 0 8px; background: #fff; font-weight: 700; }
.results .score b { font-size: 32px; }
.tablewrap { overflow-x: auto; margin-top: 8px; }
.rtab { border-collapse: collapse; font-size: 14px; width: 100%; }
.rtab th, .rtab td { border-bottom: 1px solid var(--line); padding: 5px 7px; text-align: center; white-space: nowrap; }
.rtab th { background: var(--ink); color: #fff; font-weight: 800; position: sticky; top: 0; }
.rtab td:nth-child(2), .rtab td:nth-child(3) { text-align: left; }
.rtab .see { font-size: 14px; }
.rtab .qy { background: var(--leaf-t); color: var(--leaf); font-weight: 800; }
.rtab .qx { background: var(--bad-t); color: var(--bad); font-weight: 800; }
.rtab .qb { color: var(--muted); }
.rtab tfoot td { font-weight: 800; background: var(--violet-t); }
.rtab .sc b { font-size: 16px; }
.show-key .key { display: block; max-width: 1280px; margin: 0 auto 20px; padding: 18px 20px; background: #fff; border: 2px solid var(--ink); border-radius: 18px; }
.show-key .key h2 { font: 400 30px var(--hand); margin: 0 0 6px; }
.show-key .key ol { columns: 2 320px; }
.show-key .key .why { color: var(--muted); }

/* Worksheet — print. Ink-saving: white paper, no filled blocks, colour only on thin lines and headings.
   Body classes set by the Print panel: .paper-a5 · .print-key (answer key) · .print-links (link + QR). */
@media print {
  *, *::before, *::after { background: transparent !important; box-shadow: none !important; text-shadow: none !important; }
  html, body { background: #fff !important; }
  body { font-size: 10.5pt; line-height: 1.5; color: #222; }
  body.paper-a5 { font-size: 9pt; }
  .toolbar, .banner, .teach, .who, .sublink, .hero-img, .qact, .fb, .setact, .doneact, .see, .done, .tf, .series, .msg, footer .scr { display: none !important; }
  .print-only { display: block; }
  .hero { border: 0; border-bottom: 1.5pt solid var(--ink); }
  .hero-in { padding: 0 0 6pt; grid-template-columns: 1fr auto; max-width: none; }
  h1 { font-size: 26pt; max-width: none; }
  .paper-a5 h1 { font-size: 20pt; }
  .sub { font-size: 9pt; }
  .badge { border-width: 1pt; font-size: 8pt; padding: 0 6pt; }
  .badge.lv { color: var(--ink) !important; border: 1pt solid var(--ink); }
  .links { display: none !important; border: 1pt solid var(--ink); padding: 4pt 6pt; }
  .print-links .links:has(a) { display: flex !important; }
  .scr { display: none !important; }
  .links .qr { width: 22mm; height: 22mm; }
  .links p { font-size: 7.5pt; }
  .namerow { display: flex !important; gap: 18pt; margin: 6pt 0 0; font-size: 9pt; }
  .namerow span { flex: 1; border-bottom: .8pt solid #888; padding-bottom: 2pt; }
  .layout { display: block; padding: 0; max-width: none; }
  .read { position: static; max-height: none; overflow: visible; }
  .card { border: 1.2pt solid var(--acc); border-radius: 6pt; padding: 8pt 10pt; margin: 8pt 0 0; break-inside: auto; }
  .card h2 { font-size: 18pt; margin-bottom: 2pt; }
  .card h2 .num { width: 16pt; height: 16pt; font-size: 9pt; color: var(--acc); border: 1.2pt solid var(--acc); }
  .card .hint { font-size: 8.5pt; margin-bottom: 6pt; }
  .work { display: block; }
  .passage h3 { font-size: 8.5pt; margin: 8pt 0 2pt; }
  .passage p { line-height: 1.55; margin-bottom: 5pt; padding-left: 18pt; }
  .passage p .pn { border: .8pt solid var(--acc); width: 13pt; height: 13pt; font-size: 7pt; top: 1pt; }
  mark.ev.on, .vw.on, .pp.on, .ck.flash { outline: 0 !important; }
  .words li, .pp-list li, .q { padding: 2pt 0; border: 0; border-radius: 0; margin: 0; break-inside: avoid; }
  .match { grid-template-columns: .8fr 1.2fr; gap: 10pt; display: grid; }
  .words, .defs { gap: 3pt; }
  .words select { appearance: none; -webkit-appearance: none; width: 18pt; height: 16pt; border: 1pt solid var(--ink); border-radius: 3pt; font-size: 9pt; padding: 0; }
  .words .mk, .q .mk { display: none; }
  .defs li { font-size: 9pt; }
  .defs .lt { width: 14pt; height: 14pt; font-size: 8pt; border-width: 1pt; }
  .row input, .gap input { border: 0 !important; border-bottom: .8pt dotted #555 !important; border-radius: 0; height: 16pt; }
  .row .btn, .fbs { display: none !important; }
  .row { margin-top: 1pt; }
  .tfbox { display: inline-block; min-width: 26mm; height: 14pt; border: 1pt solid var(--ink); border-radius: 3pt; margin-left: 30pt; padding: 0 4pt; font-weight: 800; font-size: 8.5pt; line-height: 13pt; }
  .q .qt { gap: 6pt; }
  .qn { min-width: 15pt; height: 15pt; font-size: 8pt; color: var(--ink); border: 1pt solid var(--ink); border-radius: 4pt; }

CO2KXQjlh8ZNwPzIHogxklfeN3UHsYxtfKGYGDhWmDqoqx6w0N08hfAtik9R2pNb7WaW9OEwExI8LzXsaXnmhk1N6hOqmKi8LE/jJoQ/g+p/dGeKkyx6e3bkflQ3ZV8A4Bq147Am2fpVxxZFjDRdSYEFBhrIWGeVghkQxBY489A5RaQvk8E9jfAt73w23I9a3y4015uoOHwLqzXAwe0RiYg7qKFQ45KJ9TtRWyU8Jpfq9R6ZLp1rnZ7gfwUZkJIa+86YtSq9mpbkwmpHKxS6tA/ghbv3WdBYmNLHVyhI9D2nyj7VfOcBjFs8XMj1YvXEoQHn3OnXzlcXYVZI38V+MkUdUzvSeVrTHcP1XIzL7dWr57FJjzSCy8WhYqtqXOCM+b6WZ1ryXknFfrP1sClQtsFAUiMJMUk3V809KU1JatLDgA", "heroAlt": "Picture for The Value of Research into Mite Harvestmen", "series": [{"label": "L1 · A2", "href": "../../l1/teacher/", "cur": false}, {"label": "L2 · B1", "href": "../../l2/teacher/", "cur": false}, {"label": "L3 · IELTS", "href": "./", "cur": true}], "next": null, "sections": [{"title": "Hard to find", "paras": [{"p": 1, "html": "<span class=\"ck\" id=\"c1\">Few people have heard of the mite harvestman, and fewer still would recognize it at close range. The insect is a relative of the far more familiar daddy longlegs.<\/span> <span class=\"ck\" id=\"c2\">But its legs are <span class=\"vw\" data-v=\"0\">stubby<\/span> rather than long, and its body is only as big as a sesame seed.<\/span> <span class=\"ck\" id=\"c3\">To find mite harvestmen, scientists go to dark, <span class=\"vw\" data-v=\"1\">humid<\/span> forests and <span class=\"vw\" data-v=\"2\">sift<\/span> through the leaf litter. The animals respond by turning <span class=\"vw\" data-v=\"3\">motionless<\/span>, <mark class=\"ev\" data-q=\"1\">making them <span data-pp=\"0\">impossible for even a trained eye to pick out<\/span><\/mark>.<\/span> <span class=\"ck\" id=\"c4\">‘They look like grains of dirt,’ said Gonzalo Giribet, an <span class=\"vw\" data-v=\"4\">invertebrate<\/span> biologist at Harvard University.<\/span>"}]}, {"title": "Clues in the animals", "paras": [{"p": 2, "html": "<span class=\"ck\" id=\"c5\">Dr Giribet and his colleagues have spent six years searching for mite harvestmen on five continents. The animals have an <span data-pp=\"1\">extraordinary story to tell<\/span>: <mark class=\"ev\" data-q=\"2\">they carry a record of hundreds of millions of years of geological history<\/mark>, <span class=\"vw\" data-v=\"5\">chronicling<\/span> the journeys that continents have made around the Earth.<\/span> <span class=\"ck\" id=\"c6\">The Earth’s landmasses have slowly collided and broken apart again several times, carrying animals and plants with them. These species have provided clues to the continents’ paths.<\/span>"}, {"p": 3, "html": "<span class=\"ck\" id=\"c7\">The notion of continental drift originally came from such clues. In 1911, the German scientist Alfred Wegener was struck by the fact that fossils of similar animals and plants could be found on either side of the Atlantic.<\/span> <span class=\"ck\" id=\"c8\">The ocean was <mark class=\"ev\" data-q=\"3\"><span data-pp=\"2\">too big for the species to have traveled across<\/span><\/mark> it on their own. <span data-pp=\"3\">Wegener <span class=\"vw\" data-v=\"6\">speculated<\/span><\/span>, correctly as it turned out, that the surrounding continents had originally been <span class=\"vw\" data-v=\"7\">welded<\/span> together in a single landmass, which he called Pangea.<\/span>"}, {"p": 4, "html": "<span class=\"ck\" id=\"c9\">Continental drift, or plate tectonics as it is scientifically known, helped move species around the world. <span data-pp=\"4\">Armadillos and their relatives<\/span> are found in South America and Africa today because their ancestors evolved when the continents were joined.<\/span> <span class=\"ck\" id=\"c10\">When <mark class=\"ev\" data-q=\"4\">South America and North America connected<\/mark> a few million years ago, armadillos spread north, too.<\/span>"}]}, {"title": "When species jump", "paras": [{"p": 5, "html": "<span class=\"ck\" id=\"c11\">Biogeographers can learn clues about continental drift by comparing related species. However, they must also recognize cases where species have <mark class=\"ev\" data-q=\"7\">spread for other reasons<\/mark>, such as by crossing great stretches of water.<\/span> <span class=\"ck\" id=\"c12\">The island of Hawaii, for example, was home to a giant flightless goose that has become <span class=\"vw\" data-v=\"8\">extinct<\/span>. Studies on DNA extracted from its bones show that it evolved from the Canada goose.<\/span> <span class=\"ck\" id=\"c13\"><mark class=\"ev\" data-q=\"5\">Having colonized <span data-pp=\"5\">Hawaii<\/span>, it branched off from that species, losing its ability to fly<\/mark>. This evolution occurred half a million years ago, when geologists estimate that Hawaii emerged from the Pacific.<\/span>"}, {"p": 6, "html": "<span class=\"ck\" id=\"c14\">When species jump around the planet, their histories blur. It is difficult to say much about where cockroaches evolved, for example, because <mark class=\"ev\" data-q=\"6\">they can <span data-pp=\"6\">move quickly from continent to continent<\/span><\/mark>.<\/span> <span class=\"ck\" id=\"c15\">This process, known as <span class=\"vw\" data-v=\"9\">dispersal<\/span>, limits many studies. ‘Most of them tend to concentrate on particular parts of the world,’ Dr Giribet said. ‘I wanted to find a new system for studying biogeography on a global scale.’<\/span>"}]}, {"title": "The perfect system", "paras": [{"p": 7, "html": "<span class=\"ck\" id=\"c16\">Dr Giribet realized that mite harvestmen might be that system. The 5,000 or so mite harvestmen species can be found on every continent except Antarctica.<\/span> <span class=\"ck\" id=\"c17\">Unlike creatures found around the world like cockroaches, mite harvestmen cannot disperse well. The typical harvestman species has a range of fewer than 50 miles.<\/span> <span class=\"ck\" id=\"c18\">Harvestmen are <mark class=\"ev\" data-q=\"8\"><span data-pp=\"7\">not found on young islands<\/span> like Hawaii<\/mark>, as these types of islands emerged long after the break-up of Pangea.<\/span>"}, {"p": 8, "html": "<span class=\"ck\" id=\"c19\">According to Assistant Professor Sarah Boyer, a former student of Dr Giribet, ‘It’s really hard to find a group of species that is distributed all over the world but that also doesn’t disperse very far.’<\/span>"}]}, {"title": "Age and DNA", "paras": [{"p": 9, "html": "<span class=\"ck\" id=\"c20\">What mite harvestmen lack in mobility, they make up in age. <mark class=\"ev\" data-q=\"11\">Their ancestors were among the first land animals<\/mark>, and fossils of daddy longlegs have been found in 400-million-year-old rocks.<\/span> <span class=\"ck\" id=\"c21\">Mite harvestmen evolved long before Pangea broke up and have been carried along by continental drift ever since. ‘They’ve managed to get themselves around the world only because they’ve been around for hundreds of millions of years,’ Dr Boyer said.<\/span> <span class=\"ck\" id=\"c22\">Dr Boyer, Dr Giribet and their colleagues have gathered thousands of mite harvestmen from around the world, <mark class=\"ev\" data-q=\"12\">from which they extracted DNA<\/mark>. Variations in the genes helped the scientists build an evolutionary tree.<\/span> <span class=\"ck\" id=\"c23\"><mark class=\"ev\" data-q=\"9\">By calculating how quickly the DNA <span class=\"vw\" data-v=\"10\">mutated<\/span>, the scientists could estimate <mark class=\"ev\" data-q=\"13\">when <span class=\"vw\" data-v=\"11\">lineages<\/span> branched off<\/mark><\/mark>. They then <mark class=\"ev\" data-q=\"14\">compared the harvestmen’s evolution to the movements of the continents<\/mark>. ‘The patterns are remarkably clear,’ Dr Boyer said.<\/span>"}, {"p": 10, "html": "<span class=\"ck\" id=\"c24\">The scientists found that they could trace mite harvestmen from their ancestors on Pangea. One lineage includes species in Chile, South Africa, Sri Lanka and other places separated by thousands of miles of ocean. But 150 million years ago, all those sites were in Gondwana, which was a region of Pangea.<\/span>"}]}, {"title": "The Florida mystery", "paras": [{"p": 11, "html": "<span class=\"ck\" id=\"c25\">The harvestmen preserve smaller patterns of continental drift, as well as bigger ones. After analyzing the DNA of a Florida harvestman, Metasiro americanus, the scientists were surprised to find that it was not related to other North American species. Its closest relatives live in West Africa.<\/span> <span class=\"ck\" id=\"c26\"><mark class=\"ev\" data-q=\"10\">Dr Boyer then began investigating the geological history of Florida and found recent research to explain the mystery<\/mark>. Florida started out welded to West Africa near Senegal. North America then collided with them as Pangea was forming.<\/span> <span class=\"ck\" id=\"c27\">About 170 million years ago, North America ripped away from West Africa, taking Florida with it. The African ancestors of Florida’s harvestmen came along for the ride.<\/span>"}, {"p": 12, "html": "<span class=\"ck\" id=\"c28\">Dr Giribet now hopes to study dozens or even hundreds of species, to find clues about plate tectonics that a single animal could not show.<\/span>"}]}], "vocab": [{"w": "stubby", "pos": "adj", "def": "short and thick", "c": "c2"}, {"w": "humid", "pos": "adj", "def": "warm and wet in the air", "c": "c3"}, {"w": "sift", "pos": "v", "def": "to search carefully through a mass of small things", "c": "c3"}, {"w": "motionless", "pos": "adj", "def": "not moving at all", "c": "c3"}, {"w": "invertebrate", "pos": "adj", "def": "without a backbone", "c": "c4"}, {"w": "chronicling", "pos": "v", "def": "recording events in the order they happened", "c": "c5"}, {"w": "speculated", "pos": "v", "def": "made a guess without full proof", "c": "c8"}, {"w": "welded", "pos": "adj", "def": "firmly joined together", "c": "c8"}, {"w": "extinct", "pos": "adj", "def": "no longer living anywhere", "c": "c12"}, {"w": "dispersal", "pos": "n", "def": "the spreading of living things to new places", "c": "c15"}, {"w": "mutated", "pos": "v", "def": "changed in a gene or in DNA", "c": "c23"}, k of certain fossils on one side of the Atlantic", "D": "similarities in living conditions on both sides of the Atlantic"}, "c": "c8", "why": "The ocean was too big for species to cross on their own.", "ev": true, "limit": null, "walk": {"loc": {"q": "Wegener’s idea", "p": "Wegener speculated"}, "dec": {"q": "used to form a single landmass", "p": "too big for the species to have traveled across it on their own"}, "break": ["Species could not cross the ocean alone.", "So similar fossils on both sides needed another explanation.", "The factor is the distance species could travel: B."], "trap": "Option C says fossils were missing on one side. The passage says similar fossils were found on both sides.", "tip": "Check the opposite. If an option says “lack of”, see whether the passage really says that."}}, {"n": 4, "t": "MCQ", "q": "What point is made by the reference to armadillos?", "a": ["A"], "g": null, "o": {"A": "Regions have both separated and become connected.", "B": "Certain animals could travel longer distances than others.", "C": "The oldest species of animals are likely to be found in Africa.", "D": "There is a tendency for animals to spread in a particular direction."}, "c": "c10", "why": "Continents were joined, then separated, then joined again.", "ev": true, "limit": null, "walk": {"loc": {"q": "reference to armadillos", "p": "Armadillos and their relatives"}, "dec": {"q": "What point is made", "p": "when the continents were joined"}, "break": ["Armadillo ancestors lived when the continents were joined.", "Later, North and South America connected again.", "So regions both separated and became connected: A."], "trap": "Option D mentions one direction. Armadillos spread north, but that is a detail, not the point.", "tip": "Ask what the example is for. The writer uses it to show a bigger idea."}}, {"n": 5, "t": "MCQ", "q": "Which of the following is stated in the fifth paragraph?", "a": ["D"], "g": null, "o": {"A": "Hawaii is a habitat that cannot support large birds.", "B": "Hawaii is an attractive habitat for certain species of birds.", "C": "Flightless birds are more likely to become extinct than others.", "D": "The Hawaiian goose became flightless after it had reached Hawaii."}, "c": "c13", "why": "After it colonized Hawaii, the goose lost its ability to fly.", "ev": true, "limit": null, "walk": {"loc": {"q": "fifth paragraph", "p": "Hawaii"}, "dec": {"q": "stated", "p": "losing its ability to fly"}, "break": ["“Having colonized Hawaii” means after it arrived there.", "Then it lost its ability to fly.", "So it became flightless after reaching Hawaii: D."], "trap": "Option B sounds friendly, but the paragraph never says Hawaii is attractive to birds.", "tip": "In “which is stated” questions, test every option against the text. Only one is directly supported."}}, {"n": 6, "t": "MCQ", "q": "Why is evidence from cockroaches of limited value?", "a": ["A"], "g": null, "o": {"A": "They spread too fast.", "B": "They multiply too quickly.", "C": "They are found in too few places.", "D": "They have divided into too many species."}, "c": "c14", "why": "They move quickly from continent to continent.", "ev": true, "limit": null, "walk": {"loc": {"q": "cockroaches", "p": "cockroaches"}, "dec": {"q": "limited value", "p": "move quickly from continent to continent"}, "break": ["The text says it is difficult to know where cockroaches evolved.", "The reason: they move quickly from continent to continent.", "So they spread too fast: A."], "trap": "Option B says they multiply quickly. The passage talks about moving, not breeding.", "tip": "Look for “because”. It often introduces the reason that the question asks for."}}, {"n": 7, "t": "YNNG", "q": "The colonization of Hawaii by geese provides evidence of continental drift.", "a": ["NO"], "g": null, "o": null, "c": "c11", "why": "The goose crossed water. That is dispersal, not continental drift.", "ev": true, "limit": null, "walk": {"loc": {"q": "colonization of Hawaii", "p": "island of : null, "walk": {"loc": {"q": "trace the development", "p": "estimate when lineages branched off"}, "dec": {"q": "number of", "p": "lineages branched off"}, "break": ["The scientists estimate when lineages branched off.", "The splits in the family tree are branches.", "So the answer is A, branches."], "trap": "The passage has “branched”, a verb. The summary needs a noun: “branches”.", "tip": "The blank may need a different word form. Check the grammar before you choose."}}, "14": {"n": 14, "t": "SumComp", "q": "Their evolution appears to reflect changes in the location of ______. For example, the same type of mite harvestman is found in places that are now far apart but used to form Gondwana, part of a huge landmass.", "a": ["continents", "I"], "g": null, "o": null, "c": "c23", "why": "They compared evolution to the movements of the continents.", "ev": true, "limit": null, "walk": {"loc": {"q": "changes in the location", "p": "movements"}, "dec": {"q": "evolution", "p": "the movements of the continents"}, "break": ["“Changes in the location” means “movements”.", "The scientists compared evolution to the movements of the continents.", "So the answer is I, continents."], "tip": "Check the answer fits the grammar of the blank. “Location of” needs a noun."}}}, "links": {"worksheet": "https://haha258369.github.io/ielts-worksheets/forecast26q1t5-miteharvestman/l3/", "video": null}, "credits": ["Reading passage and questions: IELTS Forecast 2026 Quarter 1, Test 5, Passage 3", "Photo: Marshal Hedin · CC BY 2.0 · via Wikimedia Commons"], "copyright": "Passage and questions from IELTS Forecast 2026 Quarter 1, Test 5, Passage 3 Shared for study and commentary only; all rights belong to the original owners.", "nav": {"w": "../", "s": "../student/", "t": "./"}}</script>
<script>
/* Worksheet engine. Reads the JSON in #ws-data (written by scripts/build_worksheet.py). Three modes (W.mode):
   self    site/[project]/l1/  self-study: instant check + explanations, answer key in print (the original page)
   student site/[project]/l1/student/  assigned by a teacher: name + class, NO answers in the page, "Submit" makes a result link
   teacher site/[project]/l1/teacher/  everything of self + answer key on screen + assign link/QR + class results from student
                         links (table, per-question analysis, view one student's work, Excel/CSV export)
   Result link = student page + #sub=<base64url JSON {v,id,n,c,at,d,q,w,p}>. Progress is kept in localStorage. */
(() => {
  const W = JSON.parse(document.getElementById('ws-data').textContent);
  const MODE = W.mode || 'self', STU = MODE === 'student', TEA = MODE === 'teacher';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const norm = s => String(s ?? '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[’‘`]/g, "'").replace(/[-–—]/g, ' ').replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim();
  const noArt = s => s.replace(/^(the|a|an) /, '');
  const lev = (a, b) => {
    const d = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      let p = d[0]; d[0] = i;
      for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, p + (a[i - 1] !== b[j - 1])); p = t; }
    }
    return d[b.length];
  };
  const ls = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)) || null; } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* private mode */ } },
    del(k) { try { localStorage.removeItem(k); } catch { /* ignore */ } },
  };
  const KEY = { self: 'ws:', student: 'wss:', teacher: 'wst:' }[MODE] + W.id, CLASS_KEY = 'wsc:' + W.id;
  let shared = false;   // looking at someone else's answers: never save over your own
  const store = { get: () => ls.get(KEY), set: v => { if (!shared) ls.set(KEY, v); }, clear: () => ls.del(KEY) };
  const S = { v: {}, p: {}, q: {}, done: {}, name: '', cls: '', t0: 0 };
  const LT = 'ABCDEFGHIJKLMNOP';
  const N = W.questions.length;
  const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const dec = s => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/')))));
  const pageOf = m => new URL(W.nav[m] + (location.protocol === 'file:' ? 'index.html' : ''), location.href).href.split('#')[0].split('?')[0];   // file:// has no index.html for folders
  const when = t => new Date(t).toLocaleString(undefined, { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

  /* ---------- grading (shared by instant check and the teacher's class table) ---------- */
  const isRadio = t => t === 'TFNG' || t === 'YNNG' || t === 'MCQ' || t === 'MatchFeat';
  const blank = v => !String(v ?? '').trim();
  const gradeQ = (n, v) => blank(v) ? null : W.Q[n].a.some(x => norm(x) === norm(v));
  const gradeV = (i, l) => blank(l) ? null : W.defOrder[LT.indexOf(l)] === +i;
  const gradeP = (i, v) => {
    const p = W.para[i], a = noArt(norm(v));
    if (!a) return null;
    return [p.a, ...(p.alt || [])].map(x => noArt(norm(x))).some(w => a === w || (a.includes(w) && a.split(' ').length - w.split(' ').length <= 2));
  };

  /* ---------- header ---------- */
  document.body.classList.add('lv-' + W.level, 'mode-' + MODE);
  const series = W.series.map(s => s.cur ? `<span class="cur">${esc(s.label)}</span>` : `<a href="${esc(s.href)}">${esc(s.label)}</a>`).join('');
  const linkRows = [];
  if (W.links.video) linkRows.push(`<p>▶ Watch the video:<br><a href="${esc(W.links.video)}">${esc(W.links.video)}</a></p>`);
  if (W.links.worksheet) linkRows.push(`<p>✎ Check your answers online:<br><a href="${esc(W.links.worksheet)}">${esc(W.links.worksheet.replace(/^https?:\/\//, ''))}</a></p>`);
  const defs = W.defs;
  const nextBtn = W.next && !STU ? `<a class="btn" style="display:inline-grid;place-items:center;text-decoration:none" href="${esc(W.next.href)}">Next: ${esc(W.next.label)} →</a>` : '';
  $('#app').innerHTML = `
  <header class="hero">
    ${W.hero ? `<div class="hero-img" style="background-image:url(${W.hero})" role="img" aria-label="${esc(W.heroAlt)}"></div>` : ''}
    <div class="hero-in">
      <div>
        <div class="badges"><span class="badge lv">${esc(W.levelLabel)}</span><span class="badge">${esc(W.types)}</span><span class="badge">⏱ ${W.minutes} min</span>${TEA ? '<span class="badge tea">Teacher</span>' : ''}</div>
        <h1>${esc(W.title)}</h1>
        <p class="sub">${esc(W.sub)}</p>
        <div class="series">${series}</div>
        <div class="namerow print-only"><span>Name:</span><span>Class:</span><span>Date:</span>${STU ? '' : `<span>Score: &nbsp;&nbsp;&nbsp;&nbsp;/ ${N}</span>`}</div>
      </div>
      <div class="links"><div class="qr" id="qr"></div><div>${linkRows.join('')}</div></div>
    </div>
  </header>
  <nav class="toolbar"><div class="tb-in">
    ${STU ? `<span class="chip">Answered <b id="sc-q">0/${N}</b></span>`
      : `<span class="chip">Questions <b id="sc-q">0/${N}</b></span>
    <span class="chip">Words <b id="sc-v">0/${W.vocab.length}</b></span>
    ${W.para.length ? `<span class="chip">Paraphrase <b id="sc-p">0/${W.para.length}</b></span>` : ''}`}
    <span class="grow"></span>
    ${TEA ? '<button class="tbtn ghost" id="keybtn" type="button">🔑 Answer key</button><a class="tbtn ghost" href="#teach">👩‍🏫 Class</a>' : ''}
    <button class="tbtn timer" id="timer" type="button">⏱ ${W.minutes}:00 Start</button>
    <details class="printbox"><summary class="tbtn ghost">🖨 Print</summary>
      <div class="printpanel">
        <fieldset><legend>Paper</legend>
          <label><input type="radio" name="paper" value="A4" checked> A4</label>
          <label><input type="radio" name="paper" value="A5"> A5</label></fieldset>
        <fieldset><legend>Include</legend>
          ${STU ? '' : '<label><input type="checkbox" id="pk"> Answer key (last page)</label>'}
          <label><input type="checkbox" id="pl" checked> Link &amp; QR code</label></fieldset>
        <button class="tbtn" id="doprint" type="button">Print / Save as PDF</button>
      </div></details>
  </div></nav>
  <div id="banner">${TEA ? '<div class="banner tea">Teacher page — it shows every answer. Send students the student link below, not this page.</div>' : ''}</div>
  ${TEA ? teachPanel() : ''}
  <main class="layout">
    <section class="card read" id="read">
      <h2><span class="num">1</span>Read</h2>
      <p class="hint">${esc(W.readHint)}</p>
      <div class="passage">${W.sections.map(s => `<h3>${esc(s.title)}</h3>` + s.paras.map(p => `<p><span class="pn">${p.p}</span>${p.html}</p>`).join('')).join('')}</div>
      ${W.copyright ? `<p class="copy">${esc(W.copyright)}</p>` : ''}
    </section>
    <div class="work">
      ${STU ? `<section class="card who" id="who">
        <h2><span class="num">✎</span>About you</h2>
        <p class="hint">Your teacher will see this with your answers.</p>
        <div class="whorow"><label>Name <input id="sname" type="text" autocomplete="name" maxlength="60"></label>
        <label>Class <input id="sclass" type="text" autocomplete="off" maxlength="30"></label></div>
      </section>` : ''}
      <section class="card vocab" id="vocab">
        <h2><span class="num">2</span>Vocabulary</h2>
        <p class="hint">Match each word to its meaning. Choose a letter.</p>
        <div class="match">
          <ul class="words">${W.vocab.map((v, i) => `<li data-i="${i}"><span class="w">${esc(v.w)} <span class="pos">(${esc(v.pos)})</span></span>
            <button class="see" type="button" data-see="${i}" aria-label="See ${esc(v.w)} in the text">see</button>
            <select aria-label="Meaning of ${esc(v.w)}"><option value=""></option>${defs.map((_, k) => `<option>${LT[k]}</option>`).join('')}</select><span class="mk"></span></li>`).join('')}</ul>
          <ol class="defs">${defs.map((d, k) => `<li><span class="lt">${LT[k]}</span><span>${esc(d)}</span></li>`).join('')}</ol>
        </div>
      </section>
      ${W.para.length ? `<section class="card para" id="para">
        <h2><span class="num">3</span>Paraphrase hunt</h2>
        <p class="hint">IELTS questions use different words from the text. Find the words in the text that mean the same. Copy them exactly.</p>
        <ol class="pp-list">${W.para.map((p, i) => `<li data-i="${i}"><span class="pp-q">${esc(p.q)}</span>
          <div class="row"><input type="text" autocomplete="off" spellcheck="false" aria-label="Words in the text that mean ${esc(p.q)}">
          ${STU ? '' : `<button class="btn go" type="button" data-pc="${i}">Check</button><button class="btn" type="button" data-ph="${i}">Hint</button>`}</div><div class="fbs" aria-live="polite"></div></li>`).join('')}</ol>
      </section>` : ''}
      <section class="card qs" id="questions">
        <h2><span class="num">${W.para.length ? 4 : 3}</span>Questions</h2>
        <p class="hint"><span class="scr">${STU ? 'Answer every question. Your teacher will mark your work.' : 'Answer, then press Check to see if you are right and why.'}</span><span class="print-only">Write your answers in the boxes.${STU ? '' : ' The answer key is on the last page or online.'}</span></p>
        ${W.sets.map(renderSet).join('')}
      </section>
      ${STU ? `<section class="card done" id="done">
        <h2><span class="num">★</span>Hand in</h2>
        <p class="hint">Write your name and class at the top, then press Submit. Send the link you get to your teacher (Zalo, Messenger, email…).</p>
        <p class="msg" id="msg"></p>
        <div class="doneact" id="subact">
          <button class="btn go" type="button" id="submit">Submit my answers</button>
          <button class="btn" type="button" id="reset">Start again</button>
        </div>
        <div class="sublink" id="sublink" hidden>
          <p><b>Your result link</b> — send it to your teacher:</p>
          <div class="row"><input type="text" readonly id="subUrl" aria-label="Your result link"><button class="btn go" type="button" id="copySub">Copy</button><button class="btn" type="button" id="shareSub" hidden>Share</button></div>
          <p class="hint" id="subNote"></p>
        </div>
      </section>` : `<section class="card done" id="done">
        <h2><span class="num">★</span>Your score</h2>
        <div class="score"><div><b id="r-q">0/${N}</b>Questions</div><div><b id="r-v">0/${W.vocab.length}</b>Words</div>${W.para.length ? `<div><b id="r-p">0/${W.para.length}</b>Paraphrases</div>` : ''}</div>
        <p class="msg" id="msg">Check all the questions to see your score.</p>
        <div class="doneact">
          <button class="btn go" type="button" id="checkall">Check all answers</button>
          <button class="btn" type="button" id="share">Copy result link</button>
          <button class="btn" type="button" id="reset">Start again</button>
          ${nextBtn}
        </div>
      </section>`}
    </div>
  </main>
  ${STU ? '' : `<section class="key" id="key">${renderKey()}</section>`}
  <footer>${W.credits.map(c => `<p>${esc(c)}</p>`).join('')}
    ${MODE === 'self' ? `<p class="scr">Teachers: <a href="${esc(pageOf('t'))}">assign this worksheet to a class and collect the results →</a></p>` : ''}
    ${TEA ? `<p class="scr"><a href="${esc(pageOf('w'))}">Self-study version</a> · <a href="${esc(pageOf('s'))}">Student version</a></p>` : ''}</footer>`;

  function renderSet(set) {
    const qs = W.questions.filter(q => q.n >= set.n[0] && q.n <= set.n[1]);
    const head = `<div class="set" data-set="${set.n[0]}"><h3>Questions ${set.n[0]}–${set.n[1]}</h3>`;
    if (set.t === 'MCQ') {
      return head + `<p class="instr">Choose the correct letter, <b>A</b>, <b>B</b>, <b>C</b> or <b>D</b>.</p>`
        + qs.map(q => `<div class="q" id="q${q.n}" data-n="${q.n}"><div class="qt"><span class="qn">${q.n}</span><span>${esc(q.q)}</span><span class="mk"></span></div>
          <div class="mc" role="radiogroup" aria-label="Question ${q.n}">${Object.entries(q.o).map(([k, v]) => `<label><input type="radio" name="q${q.n}" value="${k}"><span><b>${k}</b> ${esc(v)}</span></label>`).join('')}</div>
          ${qact(q)}</div>`).join('') + setact(set) + '</div>';
    }
    if (set.t === 'MatchFeat') {
      const keys = Object.keys(set.opts);
      return head + `<p class="instr">${esc(set.title)}. Choose the correct letter, <b>${keys[0]}–${keys[keys.length - 1]}</b>.</p>
        <div class="bank">${keys.map(k => `<span><b>${k}</b> ${esc(set.opts[k])}</span>`).join('')}</div>`
        + qs.map(q => `<div class="q" id="q${q.n}" data-n="${q.n}"><div class="qt"><span class="qn">${q.n}</span><span>${esc(q.q)}</span><span class="mk"></span></div>
          <div class="mc row" role="radiogroup" aria-label="Question ${q.n}">${keys.map(k => `<label><input type="radio" name="q${q.n}" value="${k}"><span><b>${k}</b></span></label>`).join('')}</div>
          ${qact(q)}</div>`).join('') + setact(set) + '</div>';
    }
    if (set.t === 'TFNG' || set.t === 'YNNG') {
      const yn = set.t === 'YNNG', opts = yn ? ['YES', 'NO', 'NOT GIVEN'] : ['TRUE', 'FALSE', 'NOT GIVEN'];
      const instr = yn ? `Do the statements agree with the views of the writer? Choose<br><b>YES</b> if the statement agrees with the writer · <b>NO</b> if the statement contradicts the writer · <b>NOT GIVEN</b> if it is impossible to say what the writer thinks about this.`
        : `Do the statements agree with the information in the text? Choose<br><b>TRUE</b> if the statement agrees with the information · <b>FALSE</b> if the statement contradicts the information · <b>NOT GIVEN</b> if there is no information on this.`;
      return head + `<p class="instr">${instr}</p>`
        + qs.map(q => `<div class="q" id="q${q.n}" data-n="${q.n}"><div class="qt"><span class="qn">${q.n}</span><span>${esc(q.q)}</span><span class="mk"></span></div>
          <div class="tf" role="radiogroup" aria-label="Question ${q.n}">${opts.map(o => `<label><input type="radio" name="q${q.n}" value="${o}"><span>${o}</span></label>`).join('')}</div>
          <span class="tfbox"></span>${qact(q)}</div>`).join('') + setact(set) + '</div>';
    }
    const groups = [];
    for (const q of qs) { let g = groups.find(x => x.g === q.g); if (!g) groups.push(g = { g: q.g, items: [] }); g.items.push(q); }
    for (const inf of set.info || []) { const g = groups.find(x => x.g === inf.g); if (g) g.items.unshift({ info: inf.text }); }
    const sum = set.t === 'SumComp';
    const keys = sum ? Object.keys(set.words) : [];
    const bank = sum ? `<div class="bank">${keys.map(k => `<span><b>${k}</b> ${esc(set.words[k])}</span>`).join('')}</div>` : '';
    return head + (sum ? `<p class="instr">Complete the summary using the list of words, <b>${keys[0]}–${keys[keys.length - 1]}</b>, below. Write the word or its letter.</p>${bank}`
      : `<p class="instr">Complete the notes. Choose <b>${esc(set.rule)}</b> from the text for each answer.</p>`) + `
      <div class="notes"><h4>${esc(set.title)}</h4>${groups.map(g => (g.g ? `<h5>${esc(g.g)}</h5>` : '') + g.items.map(q => q.info ? `<p class="info">• ${esc(q.info)}</p>` :
        `<div class="q" id="q${q.n}" data-n="${q.n}"><div class="qt"><span>${gapText(q)}</span><span class="mk"></span></div>${qact(q)}</div>`).join('')).join('')}</div>` + setact(set) + '</div>';
  }
  function gapText(q) {
    const parts = q.q.split(/_{3,}/);
    const box = `<span class="gap"><span class="qn">${q.n}</span><input type="text" autocomplete="off" spellcheck="false" aria-label="Answer ${q.n}"></span>`;
    return parts.length > 1 ? esc(parts[0]) + box + esc(parts.slice(1).join('')) : esc(q.q) + ' ' + box;
  }
  function qact(q) { return STU ? '' : `<div class="qact"><button class="btn go" type="button" data-qc="${q.n}">Check</button></div><div class="fb" aria-live="polite"></div>`; }
  function setact(set) { return STU ? '' : `<div class="setact"><button class="btn" type="button" data-sc="${set.n[0]}-${set.n[1]}">Check ${set.n[0]}–${set.n[1]}</button></div>`; }
  function renderKey() {
    return `<h2>Answer key · ${esc(W.title)}</h2><h3>Questions</h3><ol>${W.questions.map(q => `<li value="${q.n}"><b>${esc(q.a.join(' / '))}</b> <span class="why">— ${esc(q.why)}</span></li>`).join('')}</ol>
      <h3>Vocabulary</h3><ol>${W.vocab.map((v, i) => `<li><b>${esc(v.w)} → ${LT[W.defOrder.indexOf(i)]}</b></li>`).join('')}</ol>
      ${W.para.length ? `<h3>Paraphrase hunt</h3><ol>${W.para.map(p => `<li>${esc(p.q)} → <b>${esc(p.a)}</b></li>`).join('')}</ol>` : ''}`;
  }
  function teachPanel() {
    return `<section class="teach" id="teach"><div class="teach-in">
      <div class="card assign">
        <h2><span class="num">1</span>Assign to a class</h2>

        <div class="row"><input type="text" readonly id="asUrl" aria-label="Student link"><button class="btn go" type="button" id="asCopy">Copy link</button><a class="btn lnk" id="asOpen" target="_blank" rel="noopener">Open</a></div>
        <div class="asqr" id="asQr"></div>
      </div>
      <div class="card results">
        <h2><span class="num">2</span>Class results</h2>

      </div>

  }

  /* ---------- passage helpers ---------- */
  function showIn(sel, fallback) {
    $$('.on').forEach(e => e.classList.remove('on')); $$('.flash').forEach(e => e.classList.remove('flash'));
    const t = $(sel) || (fallback && $(fallback)); if (!t) return;
    t.classList.add(t.classList.contains('ck') ? 'flash' : 'on');
    const box = $('#read'), wide = getComputedStyle(box).position === 'sticky';
    if (wide) box.scrollTo({ top: t.offsetTop - box.offsetTop - box.clientHeight / 3, behavior: 'smooth' });
    else t.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  /* ---------- vocab ---------- */
  function checkVocab(li) {
    const i = +li.dataset.i, v = $('select', li).value;
    S.v[i] = v;
    if (STU) return;
    const ok = gradeV(i, v);
    li.classList.toggle('ok', ok === true); li.classList.toggle('no', ok === false);
  }

  /* ---------- paraphrase ---------- */
  function checkPara(li, reveal) {
    const i = +li.dataset.i, p = W.para[i], inp = $('input', li), fb = $('.fbs', li);
    S.p[i] = inp.value;
    if (STU) return;
    const ok = gradeP(i, inp.value);
    if (ok === null && !reveal) { li.classList.remove('ok', 'no'); fb.textContent = ''; return; }
    li.classList.toggle('ok', !!ok); li.classList.toggle('no', !ok);
    li.tries = (li.tries || 0) + (ok ? 0 : 1);
    if (ok) { fb.textContent = `✓ Yes! “${p.q}” = “${p.a}”.`; showIn(`[data-pp="${i}"]`, '#' + p.c); }
    else if (reveal || li.tries >= 2) { fb.innerHTML = `Answer: “<b>${esc(p.a)}</b>”. <button class="see" type="button" data-sp="${i}">Show me</button>`; }
    else fb.textContent = 'Not quite. Try again, or press Hint.';
  }

  /* ---------- questions ---------- */
  function readQ(n) {
    const q = $('#q' + n);
    if (isRadio(W.Q[n].t)) { const r = $('input:checked', q); return r ? r.value : ''; }
    return $('.gap input', q).value;
  }
  function checkQ(n, quiet) {
    const Q = W.Q[n], box = $('#q' + n), fb = $('.fb', box), val = readQ(n);
    S.q[n] = val;
    if (blank(val)) { if (!quiet) { fb.innerHTML = '<p class="res">Write or choose an answer first.</p>'; } return; }
    S.done[n] = 1;
    const a = norm(val), ok = gradeQ(n, val);
    box.classList.toggle('ok', ok); box.classList.toggle('no', !ok);
    let note = '';
    if (!ok && !isRadio(Q.t)) {
      if (Q.a.some(x => { const w = norm(x); return Math.abs(w.length - a.length) <= 1 && lev(w, a) <= 1 && w.length > 3; })) note = ' Very close — check the spelling or plural.';
      const lim = Q.limit; if (lim && a.split(' ').filter(w => !/^\d+$/.test(w)).length > lim) note += ` Remember: ${W.sets.find(s => n >= s.n[0] && n <= s.n[1]).rule}.`;
    }
    const L = Q.walk || {};
    fb.innerHTML = `<p class="res">${ok ? '✓ Correct!' : `✗ Not quite. Answer: ${esc(Q.a[0])}${Q.t === 'MCQ' || Q.t === 'MatchFeat' ? '. ' + esc(Q.o[Q.a[0]]) : ''}${Q.a.length > 1 && Q.t !== 'SumComp' ? ` (or ${esc(Q.a.slice(1).join(', '))})` : ''}.${note}`}</p>
      <p>${esc(Q.why)}</p>
      ${L.loc ? `<p><span class="tag loc">Locate</span>“${esc(L.loc.q)}”${L.loc.p && L.loc.p !== L.loc.q ? ` → “${esc(L.loc.p)}”` : ''}</p>` : ''}
      ${L.dec ? `<p><span class="tag dec">Decide</span>“${esc(L.dec.q)}”${L.dec.p ? ` → “${esc(L.dec.p)}”` : ' → nothing in the text'}</p>` : ''}
      ${L.break ? `<ul>${L.break.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}
      ${L.trap ? `<p><span class="tag trap">Trap</span>${esc(L.trap)}</p>` : ''}
      ${L.tip ? `<p><span class="tag tip">Tip</span>${esc(L.tip)}</p>` : ''}
      <button class="see" type="button" data-sq="${n}">${Q.ev ? 'Show the answer in the text' : 'Show the closest part of the text'}</button>`;
    const tb = $('.tfbox', box); if (tb) tb.textContent = val;
  }

  /* ---------- score / state ---------- */
  function score() {
    if (STU) {
      const answered = W.questions.filter(x => !blank(S.q[x.n])).length;
      $('#sc-q').textContent = `${answered}/${N}`;
      if (!$('#msg').dataset.hold) $('#msg').textContent = answered < N ? `You have answered ${answered} of ${N} questions.` : `All ${N} questions answered. Ready to submit!`;
      store.set(S); return;
    }
    const q = W.questions.filter(x => $('#q' + x.n).classList.contains('ok')).length;
    const qd = Object.keys(S.done).length;
    const v = $$('.words li.ok').length, p = $$('.pp-list li.ok').length;
    $('#sc-q').textContent = $('#r-q').textContent = `${q}/${N}`;
    $('#sc-v').textContent = $('#r-v').textContent = `${v}/${W.vocab.length}`;
    if (W.para.length) $('#sc-p').textContent = $('#r-p').textContent = `${p}/${W.para.length}`;
    $('#msg').textContent = qd < N ? `You have checked ${qd} of ${N} questions.`
      : q === N ? 'Perfect score! Try the next level.' : q >= N * .75 ? 'Great work! Read the explanations for the ones you missed.'
      : q >= N * .5 ? 'Good start. Go back to the text and look at the paraphrases.' : 'Keep going: watch the video again, then try once more.';
    store.set(S);
  }
  function fill(st) {
    for (const [i, v] of Object.entries(st.v || {})) { const li = $(`.words li[data-i="${i}"]`); if (li) { $('select', li).value = v; checkVocab(li); } }
    for (const [i, v] of Object.entries(st.p || {})) { const li = $(`.pp-list li[data-i="${i}"]`); if (li) { $('input', li).value = v; if (v) checkPara(li); } }
    for (const [n, v] of Object.entries(st.q || {})) {
      const box = $('#q' + n); if (!box || !W.Q[n]) continue;
      if (isRadio(W.Q[n].t)) { const r = $(`input[value="${v}"]`, box); if (r) r.checked = true; } else $('.gap input', box).value = v;
      S.q[n] = v;
      if (!STU && (st.done || {})[n]) checkQ(+n, true);
      const tb = $('.tfbox', box); if (tb) tb.textContent = v;
    }
    if (STU) { S.name = st.name || ''; S.cls = st.cls || ''; S.t0 = st.t0 || 0; $('#sname').value = S.name; $('#sclass').value = S.cls; }
  }
  function clearUI() {
    $$('.work select').forEach(s => { s.value = ''; });
    $$('.work input[type=text]').forEach(i => { i.value = ''; });
    $$('.work input[type=radio]').forEach(i => { i.checked = false; });
    $$('.work .ok, .work .no').forEach(e => e.classList.remove('ok', 'no'));
    $$('.work .fb, .work .fbs').forEach(e => { e.innerHTML = ''; });
    Object.assign(S, { v: {}, p: {}, q: {}, done: {} });
  }

  /* ---------- events ---------- */
  const touched = () => { if (STU && !S.t0) S.t0 = Date.now(); if (STU) unsubmitted(); };
  document.addEventListener('change', e => {
    if (!e.target.closest('.work')) return;
    touched();
    const li = e.target.closest('.words li'); if (li) { checkVocab(li); score(); return; }
    const q = e.target.closest('.q'); if (q && e.target.type === 'radio') { S.q[q.dataset.n] = e.target.value; const tb = $('.tfbox', q); if (tb) tb.textContent = e.target.value; score(); }
  });

    if (!e.target.closest('.work')) return;
    if (e.target.id === 'sname') { S.name = e.target.value; store.set(S); return; }
    if (e.target.id === 'sclass') { S.cls = e.target.value; store.set(S); return; }
    touched();
    const q = e.target.closest('.q'); if (q) { S.q[q.dataset.n] = e.target.value; score(); }

  });

    if (STU || e.key !== 'Enter' || e.target.tagName !== 'INPUT' || !e.target.closest('.work')) return;

    const q = e.target.closest('.q'); if (q) { checkQ(+q.dataset.n); score(); }
  });
  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (d.see) showIn(`[data-v="${d.see}"]`, '#' + W.vocab[+d.see].c);
    else if (d.pc) { checkPara(b.closest('li')); score(); }
    else if (d.ph) showIn('#' + W.para[+d.ph].c);
    else if (d.sp) showIn(`[data-pp="${d.sp}"]`, '#' + W.para[+d.sp].c);
    else if (d.qc) { checkQ(+d.qc); score(); }
    else if (d.sq) showIn(`mark[data-q~="${d.sq}"]`, '#' + W.Q[d.sq].c);

  });
  $('#reset').onclick = () => { if (!confirm('Clear all your answers?')) return; store.clear(); location.hash = ''; location.reload(); };
  if (!STU) {
    $('#checkall').onclick = () => { W.questions.forEach(q => checkQ(q.n, true)); score(); };
    $('#share').onclick = async () => {
      const url = location.href.split('#')[0] + '#r=' + enc(S);
      try { await navigator.clipboard.writeText(url); $('#share').textContent = 'Link copied ✓'; }
      catch { prompt('Copy this link:', url); }
      setTimeout(() => { $('#share').textContent = 'Copy result link'; }, 2500);
    };
  }

  /* ---------- student: submit -> result link ---------- */
  let warned = false;
  function unsubmitted() {
    if ($('#sublink') && !$('#sublink').hidden) { $('#sublink').hidden = true; say('You changed an answer — press Submit again to get a new link.'); }
    else if (warned) { warned = false; say(''); }
  }
  function say(t) { const m = $('#msg'); m.textContent = t; m.dataset.hold = t ? '1' : ''; }
  if (STU) {
    $('#submit').onclick = () => {
      S.name = $('#sname').value.trim(); S.cls = $('#sclass').value.trim();
      if (!S.name || !S.cls) { say('Please write your name and your class first.'); $('#who').scrollIntoView({ behavior: 'smooth', block: 'center' }); (S.name ? $('#sclass') : $('#sname')).focus(); return; }
      const empty = W.questions.filter(x => blank(S.q[x.n])).map(x => x.n);
      if (empty.length && !warned) { warned = true; say(`Question${empty.length > 1 ? 's' : ''} ${empty.join(', ')} ${empty.length > 1 ? 'have' : 'has'} no answer. Press Submit again to hand in anyway.`); return; }
      warned = false;
      const at = Date.now();
      const sub = { v: 1, id: W.id, n: S.name, c: S.cls, at, d: S.t0 ? Math.round((at - S.t0) / 1000) : 0, q: S.q, w: S.v, p: S.p };
      const url = pageOf('s') + '#sub=' + enc(sub);

      $('#sublink').hidden = false;

  }
  async function copy(text, btn) {
    const old = btn.textContent;
    try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied ✓'; }
    catch { const i = btn.parentElement.querySelector('input'); if (i) { i.select(); } btn.textContent = 'Press Ctrl+C'; }
    setTimeout(() => { btn.textContent = old; }, 2500);
  }

  /* ---------- teacher: assign + class results ---------- */
  let classList = TEA ? (ls.get(CLASS_KEY) || []) : [];
  const recKey = r => norm(r.c) + '|' + norm(r.n);
  function grade(r) {
    const q = W.questions.map(x => gradeQ(x.n, (r.q || {})[x.n]));
    const v = W.vocab.filter((_, i) => gradeV(i, (r.w || {})[i])).length;
    const p = W.para.filter((_, i) => gradeP(i, (r.p || {})[i])).length;
    return { q, score: q.filter(x => x).length, v, p };
  }
  function assignUrl() {
    const c = $('#asClass').value.trim();
    return pageOf('s') + (c ? '?class=' + encodeURIComponent(c) : '');
  }
  function drawAssign() {
    const u = assignUrl();
    $('#asUrl').value = u; $('#asOpen').href = u;
    qr(u, $('#asQr'), 5);
  }
  function addLinks(text) {
    const found = [...text.matchAll(/#sub=([A-Za-z0-9_-]+)/g)].map(m => m[1]);
    let added = 0, updated = 0, same = 0, bad = 0;
    const other = {};
    for (const s of found) {
      let r; try { r = dec(s); } catch { bad++; continue; }
      if (!r || r.v !== 1 || !r.n) { bad++; continue; }
      if (r.id !== W.id) { const lv = r.id.split('__')[3] || r.id; other[lv] = (other[lv] || 0) + 1; continue; }
      const k = recKey(r), i = classList.findIndex(x => recKey(x) === k);
      if (i < 0) { classList.push(r); added++; }
      else if (r.at > classList[i].at) { classList[i] = r; updated++; }
      else same++;
    }
    ls.set(CLASS_KEY, classList);
    const msg = [];
    if (!found.length) msg.push('No result links found. A result link contains “#sub=”.');
    if (added) msg.push(`${added} added`);
    if (updated) msg.push(`${updated} updated (newer submission)`);
    if (same) msg.push(`${same} already in the list`);
    if (bad) msg.push(`${bad} link${bad > 1 ? 's are' : ' is'} damaged (cut off?) — ask the student to copy it again`);
    for (const [lv, n] of Object.entries(other)) msg.push(`${n} link${n > 1 ? 's are' : ' is'} for another worksheet (${lv.replace('_', ' · ')}) — open that level's teacher page`);
    $('#addMsg').textContent = msg.join(' · ');
    drawTable();
  }
  function shown() {
    const f = $('#fClass').value;
    return classList.filter(r => !f || r.c === f).sort((a, b) => a.c.localeCompare(b.c) || a.n.localeCompare(b.n));
  }
  function drawTable() {
    const classes = [...new Set(classList.map(r => r.c))].sort();
    const fSel = $('#fClass'), cur = fSel.value;
    fSel.innerHTML = `<option value="">All classes (${classList.length})</option>` + classes.map(c => `<option${c === cur ? ' selected' : ''}>${esc(c)}</option>`).join('');
    fSel.hidden = classes.length < 2;
    const rows = shown();
    const tab = $('#rtab');
    if (!rows.length) { tab.innerHTML = ''; $('#summary').innerHTML = '<p class="hint">No results yet.</p>'; return; }
    const G = rows.map(grade);
    const qn = W.questions.map(q => q.n);
    const right = qn.map((_, k) => G.filter(g => g.q[k]).length);
    const scores = G.map(g => g.score), avg = scores.reduce((a, b) => a + b, 0) / rows.length;
    const hard = qn.map((n, k) => [n, right[k] / rows.length]).sort((a, b) => a[1] - b[1]).slice(0, 3).filter(x => x[1] < 1);
    $('#summary').innerHTML = `<div class="score">
      <div><b>${rows.length}</b>Students</div><div><b>${avg.toFixed(1)}/${N}</b>Average (${Math.round(avg / N * 100)}%)</div>
      <div><b>${Math.max(...scores)}</b>Highest</div><div><b>${Math.min(...scores)}</b>Lowest</div></div>
      ${hard.length ? `<p class="hint">Hardest: ${hard.map(([n, r]) => `Q${n} (${Math.round(r * 100)}% right)`).join(' · ')}. Click a student's name to see their work with explanations.</p>` : ''}`;
    tab.innerHTML = `<thead><tr><th>#</th><th>Name</th><th>Class</th><th>Submitted</th><th>Min</th><th>Score</th><th>Words</th>${W.para.length ? '<th>Para</th>' : ''}${qn.map(n => `<th>Q${n}</th>`).join('')}<th></th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr>
        <td>${i + 1}</td><td><button class="see" type="button" data-view="${esc(recKey(r))}">${esc(r.n)}</button></td><td>${esc(r.c)}</td>
        <td class="nw">${esc(when(r.at))}</td><td>${r.d ? Math.max(1, Math.round(r.d / 60)) : ''}</td>
        <td class="sc"><b>${G[i].score}</b>/${N}</td><td>${G[i].v}/${W.vocab.length}</td>${W.para.length ? `<td>${G[i].p}/${W.para.length}</td>` : ''}
        ${qn.map((n, k) => { const a = (r.q || {})[n]; return `<td class="${G[i].q[k] === null ? 'qb' : G[i].q[k] ? 'qy' : 'qx'}" title="${esc(a || 'no answer')}">${G[i].q[k] === null ? '–' : G[i].q[k] ? '✓' : '✗'}</td>`; }).join('')}
        <td><button class="see" type="button" data-del="${esc(recKey(r))}" aria-label="Remove ${esc(r.n)}">✕</button></td></tr>`).join('')}</tbody>
      <tfoot><tr><td></td><td colspan="${W.para.length ? 7 : 6}">% right</td>${right.map(x => `<td>${Math.round(x / rows.length * 100)}</td>`).join('')}<td></td></tr></tfoot>`;
  }
  function viewStudent(r) {
    shared = true;
    clearUI();

    W.questions.forEach(q => { if (blank((r.q || {})[q.n])) { const b = $('#q' + q.n); b.classList.add('no'); $('.fb', b).innerHTML = `<p class="res">✗ No answer. Answer: ${esc(q.a[0])}</p><p>${esc(q.why)}</p>`; } });

    const g = grade(r);
    $('#banner').innerHTML = `<div class="banner view">Viewing <b>${esc(r.n)}</b> (${esc(r.c)}) · submitted ${esc(when(r.at))} · ${g.score}/${N}
      <button class="tbtn" type="button" id="backList">← Class list</button><button class="tbtn" type="button" id="closeView">Close</button></div>`;
    $('#backList').onclick = () => $('#teach').scrollIntoView({ behavior: 'smooth' });
    $('#closeView').onclick = () => { location.hash = ''; location.reload(); };
    $('#questions').scrollIntoView({ behavior: 'smooth' });
  }
  function table() {
    const rows = shown(), G = rows.map(grade), qn = W.questions.map(q => q.n);
    const head = ['Name', 'Class', 'Submitted', 'Minutes', 'Score', 'Out of', '%', 'Vocabulary', ...(W.para.length ? ['Paraphrase'] : []), ...qn.map(n => 'Q' + n)];
    const body = rows.map((r, i) => [r.n, r.c, new Date(r.at).toLocaleString(), r.d ? Math.max(1, Math.round(r.d / 60)) : '', G[i].score, N, Math.round(G[i].score / N * 100),
      `${G[i].v}/${W.vocab.length}`, ...(W.para.length ? [`${G[i].p}/${W.para.length}`] : []),
      ...qn.map((n, k) => { const a = (r.q || {})[n]; return G[i].q[k] === null ? '–' : (G[i].q[k] ? '✓ ' : '✗ ') + a; })]);
    const qs = [['Question', 'Type', 'Answer', 'Right', 'Wrong', 'No answer', '% right'],
      ...W.questions.map((q, k) => { const c = G.map(g => g.q[k]); const y = c.filter(x => x === true).length;
        return [q.n, q.t, q.a.join(' / '), y, c.filter(x => x === false).length, c.filter(x => x === null).length, rows.length ? Math.round(y / rows.length * 100) : 0]; })];

  }
  const fname = ext => `${W.title.replace(/[^\w]+/g, '_').replace(/^_|_$/g, '')}_${W.level}_${$('#fClass').value.replace(/[^\w]+/g, '_') || 'all'}_${new Date().toISOString().slice(0, 10)}.${ext}`;
  function save(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
  function csv() {
    const { head, body } = table();
    const q = v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    save(new Blob(['﻿' + [head, ...body].map(r => r.map(q).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }), fname('csv'));
  }
  function load(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
  async function xlsx() {
    const b = $('#xlsx'), old = b.textContent;
    b.textContent = '…';
    try {
      if (!window.XLSX) await load('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
      const { head, body, qs } = table();
      const wb = XLSX.utils.book_new();
      const s1 = XLSX.utils.aoa_to_sheet([head, ...body]);
      s1['!cols'] = head.map((h, i) => ({ wch: i === 0 ? 24 : i === 2 ? 18 : h.startsWith('Q') ? 12 : 10 }));
      XLSX.utils.book_append_sheet(wb, s1, 'Results');
      const s2 = XLSX.utils.aoa_to_sheet(qs); s2['!cols'] = [{ wch: 9 }, { wch: 10 }, { wch: 30 }, { wch: 7 }, { wch: 7 }, { wch: 10 }, { wch: 8 }];
      XLSX.utils.book_append_sheet(wb, s2, 'Questions');
      XLSX.writeFile(wb, fname('xlsx'));
    } catch { $('#addMsg').textContent = 'Excel export needs an internet connection — downloaded a CSV instead (Excel opens it too).'; csv(); }
    b.textContent = old;
  }
  if (TEA) {
    const c0 = new URLSearchParams(location.search).get('class'); if (c0) $('#asClass').value = c0;
    $('#asClass').addEventListener('input', drawAssign);
    $('#asCopy').onclick = () => copy($('#asUrl').value, $('#asCopy'));
    $('#addLinks').onclick = () => { addLinks($('#paste').value); $('#paste').value = ''; };
    $('#fClass').onchange = drawTable;
    $('#csv').onclick = () => { if (shown().length) csv(); };
    $('#xlsx').onclick = () => { if (shown().length) xlsx(); };
    $('#clearList').onclick = () => { if (!classList.length || !confirm(`Remove all ${classList.length} results from this browser?`)) return; classList = []; ls.set(CLASS_KEY, classList); drawTable(); };
    $('#rtab').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const r = classList.find(x => recKey(x) === (b.dataset.view || b.dataset.del)); if (!r) return;
      if (b.dataset.view) viewStudent(r);
      else if (confirm(`Remove ${r.n} (${r.c})?`)) { classList = classList.filter(x => x !== r); ls.set(CLASS_KEY, classList); drawTable(); }
    });
    $('#keybtn').onclick = () => { const on = document.body.classList.toggle('show-key'); if (on) $('#key').scrollIntoView({ behavior: 'smooth' }); };
  }

  /* timer */
  let left = W.minutes * 60, tid = 0;
  const tbtn = $('#timer'), fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  tbtn.onclick = () => {
    if (tid) { clearInterval(tid); tid = 0; tbtn.classList.remove('run'); tbtn.textContent = `⏱ ${fmt(left)} Go on`; return; }
    if (left <= 0) left = W.minutes * 60;
    tbtn.classList.add('run'); tbtn.classList.remove('out');
    tid = setInterval(() => {
      left--; tbtn.textContent = `⏱ ${fmt(left)} Pause`;
      if (left <= 0) { clearInterval(tid); tid = 0; tbtn.classList.replace('run', 'out'); tbtn.textContent = "⏱ Time's up!"; }
    }, 1000);
    tbtn.textContent = `⏱ ${fmt(left)} Pause`;
  };

  /* print panel */
  const pg = document.createElement('style'); document.head.appendChild(pg);
  function paper() {
    const a5 = $('input[name="paper"]:checked').value === 'A5';
    document.body.classList.toggle('paper-a5', a5);
    document.body.classList.toggle('print-key', !!$('#pk')?.checked);
    document.body.classList.toggle('print-links', $('#pl').checked);
    pg.textContent = `@page { size: ${a5 ? 'A5' : 'A4'}; margin: ${a5 ? '9mm' : '12mm'}; }`;
  }
  $$('.printpanel input').forEach(i => i.addEventListener('change', paper));
  $('#doprint').onclick = () => { paper(); $('.printbox').open = false; window.print(); };
  const qs = new URLSearchParams(location.search);   // ?paper=A5&key=1&links=0 (used by scripts/print_worksheet.mjs)
  if (qs.get('paper') === 'A5') $('input[value="A5"]').checked = true;
  if (qs.get('key') === '1' && $('#pk')) $('#pk').checked = true;
  if (qs.get('links') === '0') $('#pl').checked = false;
  paper();

  /* QR codes (header: video link if known, else this worksheet; teacher: the student link) */
  let qrLib = null;
  function qr(url, el, cell) {
    if (!url || !el) return;
    qrLib = qrLib || load('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js');
    qrLib.then(() => { try { const q = qrcode(0, 'M'); q.addData(url); q.make(); el.innerHTML = q.createSvgTag({ cellSize: cell || 4, margin: 0, scalable: true }); } catch { /* no QR */ } }).catch(() => {});
  }
  qr(W.links.video || W.links.worksheet, $('#qr'));

  /* restore */
  const h = location.hash;
  let saved = null;
  const mr = h.match(/^#r=(.+)$/), ms = h.match(/^#sub=([A-Za-z0-9_-]+)/);
  if (mr && !STU) { try { saved = dec(mr[1]); shared = true; $('#banner').innerHTML = '<div class="banner">You are looking at a shared result. Press “Start again” to try it yourself.</div>'; } catch { saved = null; } }
  if (ms) {
    let r = null; try { r = dec(ms[1]); } catch { /* damaged */ }
    if (r && r.id === W.id && STU) {          // a student's result link opened: read-only copy, never marked here
      shared = true;
      saved = { v: r.w, p: r.p, q: r.q, name: r.n, cls: r.c };
      document.body.classList.add('locked');
      $('#banner').innerHTML = `<div class="banner">Answers handed in by <b>${esc(r.n)}</b> (${esc(r.c)}) · ${esc(when(r.at))}. This copy cannot be changed. Teachers: paste this link into the teacher page to mark it.</div>`;
    } else if (r && r.id === W.id && TEA) {   // pasted into the teacher page's address bar: add it to the list
      addLinks(h); history.replaceState(null, '', location.pathname + location.search);
    } else if (STU) $('#banner').innerHTML = '<div class="banner">This result link is damaged or belongs to another worksheet.</div>';
  }
  fill(saved || store.get() || S);
  if (STU && !saved) { const c = qs.get('class'); if (c && !$('#sclass').value) { $('#sclass').value = S.cls = c; } }
  if (document.body.classList.contains('locked')) { $$('.work input, .work select').forEach(i => { i.disabled = true; }); $('#done').hidden = true; }
  score();
  if (TEA) { drawAssign(); drawTable(); }
})();

</script>
</body>
</html>
