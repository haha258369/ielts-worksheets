<head>

<title>The Kakapo: A Parrot That Cannot Fly — Level A2 worksheet</title>
<meta name="description" content="Read the story, learn 7 key words, then answer 8 IELTS-style questions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Worksheet — screen styles (bright). Print styles live in print.css. */
:root {
  color-scheme: light;
  --ink: #1f2a37; --muted: #5b6675; --line: #e6e1d6; --paper: #fffdf8; --card: #ffffff;
  --sky: #1e88e5;   --sky-t: #e8f3fd;
  --sun: #f08c00;   --sun-t: #fff3e0;
  --leaf: #17a34a;  --leaf-t: #e7f7ec;
  --berry: #d6336c; --berry-t: #fde8ef;
  --violet: #7048e8; --violet-t: #efeafd;
  --bad: #e03131;   --bad-t: #fdecec;
  --hl: #ffe066;
  --body: 'Nunito', system-ui, sans-serif;
  --hand: 'Patrick Hand', 'Caveat', cursive;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 var(--body); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--sky); }
.print-only { display: none; }

/* ---------- header ---------- */
.hero { position: relative; overflow: hidden; background: linear-gradient(120deg, #fff6d8, #e6f6ff 55%, #f0ffe9); border-bottom: 3px solid var(--ink); }
.hero-in { max-width: 1280px; margin: 0 auto; padding: 28px 20px 24px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; position: relative; z-index: 1; }
.hero-img { position: absolute; inset: 0 0 0 auto; width: min(52%, 620px); background-size: cover; background-position: center; -webkit-mask-image: linear-gradient(90deg, transparent, #000 45%); mask-image: linear-gradient(90deg, transparent, #000 45%); }
.badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.badge { display: inline-block; padding: 2px 12px; border: 2px solid var(--ink); border-radius: 999px; font-weight: 800; font-size: 14px; background: #fff; }
.badge.lv { color: #fff; border-color: transparent; }
.lv-L1_A2 .badge.lv { background: var(--leaf); }
.lv-L2_B1 .badge.lv { background: var(--sky); }
.lv-L3_IELTS .badge.lv { background: var(--violet); }
h1 { font: 400 clamp(34px, 6vw, 56px)/1.05 var(--hand); margin: 0 0 6px; max-width: 16ch; }
.sub { margin: 0; color: var(--muted); font-weight: 700; max-width: 52ch; }
.series { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.series a, .series span { font-size: 14px; font-weight: 800; padding: 3px 10px; border-radius: 8px; text-decoration: none; border: 2px dashed var(--muted); color: var(--muted); background: rgba(255,255,255,.75); }
.series span.cur { border-style: solid; border-color: var(--ink); color: var(--ink); background: #fff; }
.links { display: flex; gap: 14px; align-items: center; background: rgba(255,255,255,.9); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px; }
.links .qr { width: 92px; height: 92px; display: grid; place-items: center; }
.links .qr svg, .links .qr img { width: 100%; height: 100%; }
.links .qr:empty { display: none; }
.links p { margin: 0; font-size: 14px; font-weight: 700; max-width: 26ch; overflow-wrap: anywhere; }
.links:not(:has(a)) { display: none; }

/* ---------- toolbar ---------- */
.toolbar { position: sticky; top: 0; z-index: 20; background: var(--ink); color: #fff; }
.tb-in { max-width: 1280px; margin: 0 auto; padding: 8px 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 4px 12px; border-radius: 999px; font-weight: 800; font-size: 14px; background: rgba(255,255,255,.12); }
.chip b { color: var(--hl); }
.tb-in .grow { flex: 1; }
.tbtn { border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 14px; background: #fff; color: var(--ink); }
.tbtn.ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.5); }
.tbtn.timer.run { background: var(--hl); }
.tbtn.timer.out { background: var(--bad); color: #fff; }
.printbox { position: relative; }
.printbox summary { list-style: none; }
.printbox summary::-webkit-details-marker { display: none; }
.printpanel { position: absolute; right: 0; top: calc(100% + 8px); background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: 14px; padding: 14px; width: 260px; box-shadow: 0 12px 30px rgba(0,0,0,.2); }
.printpanel fieldset { border: 0; margin: 0 0 10px; padding: 0; }
.printpanel legend { font-weight: 800; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.printpanel label { display: flex; gap: 8px; align-items: center; font-size: 15px; padding: 2px 0; }
.printpanel .tbtn { width: 100%; background: var(--ink); color: #fff; margin-top: 4px; }
.banner { background: var(--hl); color: var(--ink); text-align: center; font-weight: 800; padding: 6px 12px; font-size: 15px; }

/* ---------- layout ---------- */
.layout { max-width: 1280px; margin: 0 auto; padding: 20px; display: grid; gap: 20px; }
@media (min-width: 1060px) {
  .layout { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
  .read { position: sticky; top: 64px; max-height: calc(100vh - 84px); overflow: auto; }
}
.card { background: var(--card); border: 2px solid var(--ink); border-radius: 18px; padding: 18px 20px 20px; box-shadow: 5px 5px 0 var(--acc, var(--ink)); --acc: var(--sky); --tint: var(--sky-t); }
.work { display: grid; gap: 20px; min-width: 0; }
.card h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; font: 400 32px/1.1 var(--hand); }
.card h2 .num { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--acc); color: #fff; font: 800 18px var(--body); flex: none; }
.card .hint { margin: 0 0 14px; color: var(--muted); font-size: 15px; font-weight: 600; }
.read { --acc: var(--sky); --tint: var(--sky-t); }
.vocab { --acc: var(--sun); --tint: var(--sun-t); }
.para { --acc: var(--berry); --tint: var(--berry-t); }
.qs { --acc: var(--leaf); --tint: var(--leaf-t); }
.done { --acc: var(--violet); --tint: var(--violet-t); }

/* ---------- passage ---------- */
.passage h3 { font: 800 15px var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--acc); margin: 18px 0 6px; }
.passage h3:first-child { margin-top: 4px; }
.passage p { margin: 0 0 12px; line-height: 1.85; letter-spacing: .015em; word-spacing: .06em; position: relative; padding-left: 30px; }
.passage p .pn { position: absolute; left: 0; top: 4px; width: 22px; height: 22px; border-radius: 6px; background: var(--tint); color: var(--acc); font-size: 12px; font-weight: 800; display: grid; place-items: center; line-height: 1; }
.passage .ck { border-radius: 4px; transition: background .4s; }
.passage .ck.flash { background: var(--sky-t); outline: 2px dashed var(--sky); }
mark.ev { background: none; color: inherit; border-radius: 3px; }
mark.ev.on { background: var(--hl); box-shadow: 0 0 0 2px var(--hl); }
.vw.on { background: var(--sun-t); outline: 2px solid var(--sun); border-radius: 3px; }
.pp.on { background: var(--berry-t); outline: 2px solid var(--berry); border-radius: 3px; }
.copy { font-size: 13px; color: var(--muted); margin: 14px 0 0; }

/* ---------- vocab ---------- */
.match { display: grid; gap: 18px; }
@media (min-width: 640px) { .match { grid-template-columns: 0.9fr 1.1fr; } }
.words, .defs { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.words li { display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 12px; background: var(--tint); }
.words .w { font-weight: 800; flex: 1; }
.words .pos { font-size: 13px; color: var(--muted); font-weight: 700; }
.words select { width: 58px; height: 38px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; text-align: center; font-weight: 800; }
.words li.ok { background: var(--leaf-t); }
.words li.ok select { border-color: var(--leaf); color: var(--leaf); }
.words li.no select { border-color: var(--bad); color: var(--bad); }
.mk { width: 22px; font-weight: 800; text-align: center; }
.ok > .mk::after, .ok .mk::after { content: '✓'; color: var(--leaf); }
.no > .mk::after, .no .mk::after { content: '✗'; color: var(--bad); }
.defs li { display: flex; gap: 10px; font-size: 15px; line-height: 1.45; }
.defs .lt { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--acc); color: var(--acc); font-weight: 800; display: grid; place-items: center; font-size: 14px; }
.see { border: 0; background: none; padding: 0; color: var(--acc); font-weight: 800; font-size: 13px; text-decoration: underline; }

/* ---------- paraphrase ---------- */
.pp-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.pp-list li { padding: 10px 12px; border-radius: 12px; background: var(--tint); }
.pp-q { font-weight: 800; }
.pp-q::before { content: '“'; } .pp-q::after { content: '”'; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.row input { flex: 1 1 200px; min-width: 0; height: 40px; border: 2px solid var(--ink); border-radius: 10px; padding: 0 12px; background: #fff; }
.btn { height: 40px; border: 2px solid var(--ink); border-radius: 10px; padding: 0 14px; font-weight: 800; background: #fff; }
.btn.go { background: var(--acc); color: #fff; border-color: var(--acc); }
.fbs { font-size: 15px; margin-top: 6px; font-weight: 700; }
.ok .fbs { color: var(--leaf); } .no .fbs { color: var(--bad); }
.ok input { border-color: var(--leaf); background: var(--leaf-t); }
.no input { border-color: var(--bad); }

/* ---------- questions ---------- */
.set { margin-top: 8px; }
.set + .set { margin-top: 26px; }
.set h3 { font: 800 18px var(--body); margin: 0 0 4px; }
.instr { font-size: 15px; color: var(--muted); margin: 0 0 12px; }
.instr b { color: var(--ink); }
.q { padding: 12px 14px; border-radius: 14px; border: 2px solid transparent; background: var(--tint); margin-bottom: 10px; }
.q.ok { border-color: var(--leaf); background: #fff; }
.q.no { border-color: var(--bad); background: #fff; }
.q .qt { display: flex; gap: 10px; }
.qn { flex: none; display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 9px; background: var(--ink); color: #fff; font-weight: 800; font-size: 15px; }
.tf { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0 40px; align-items: center; }
.tf label { position: relative; }
.tf input { position: absolute; opacity: 0; inset: 0; }
.tf span { display: inline-block; padding: 5px 14px; border: 2px solid var(--ink); border-radius: 999px; font-weight: 800; font-size: 14px; background: #fff; }
.tf input:checked + span { background: var(--ink); color: #fff; }
.tf input:focus-visible + span { outline: 3px solid var(--sky); outline-offset: 2px; }
.tfbox { display: none; }
.notes { border: 2px dashed var(--acc); border-radius: 14px; padding: 14px 16px; background: #fff; }
.notes h4 { text-align: center; font: 400 26px var(--hand); margin: 0 0 6px; }
.notes h5 { font: 800 15px var(--body); margin: 14px 0 6px; color: var(--acc); }
.notes .info { margin: 0 0 8px 18px; }
.notes .q { background: none; padding: 6px 8px; margin: 0 0 6px; }
.notes .qt { align-items: baseline; }
.notes .qt::before { content: '•'; font-weight: 800; color: var(--acc); }
.gap { display: inline-flex; align-items: baseline; gap: 4px; }
.gap .qn { min-width: 26px; height: 26px; font-size: 13px; transform: translateY(-1px); }
.gap input { width: 150px; max-width: 46vw; height: 34px; border: 0; border-bottom: 3px dotted var(--ink); background: var(--sun-t); border-radius: 6px 6px 0 0; padding: 0 8px; font-weight: 800; }
.q.ok .gap input { background: var(--leaf-t); border-bottom-color: var(--leaf); }
.q.no .gap input { background: var(--bad-t); border-bottom-color: var(--bad); }
.qact { display: flex; gap: 8px; margin: 8px 0 0 40px; }
.qact .btn { height: 32px; font-size: 14px; padding: 0 12px; }
.fb { margin: 10px 0 0 40px; font-size: 15px; line-height: 1.5; }
.fb:empty { display: none; }
.fb .res { font-weight: 800; margin: 0 0 4px; }
.q.ok .res { color: var(--leaf); } .q.no .res { color: var(--bad); }
.fb p, .fb ul { margin: 0 0 6px; }
.fb ul { padding-left: 18px; }
.tag { display: inline-block; font-size: 12px; font-weight: 800; padding: 1px 8px; border-radius: 6px; color: #fff; margin-right: 4px; }
.tag.loc { background: var(--leaf); } .tag.dec { background: var(--sun); } .tag.trap { background: var(--bad); } .tag.tip { background: var(--violet); }
.setact { display: flex; gap: 8px; justify-content: flex-end; }

/* ---------- done ---------- */
.score { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 14px; }
.score div { flex: 1 1 140px; text-align: center; padding: 12px; border-radius: 14px; background: var(--tint); font-weight: 800; }
.score b { display: block; font: 400 40px/1 var(--hand); color: var(--acc); }
.doneact { display: flex; flex-wrap: wrap; gap: 8px; }
.msg { font-weight: 700; color: var(--muted); }
.key { display: none; }
footer { max-width: 1280px; margin: 0 auto; padding: 8px 20px 40px; font-size: 13px; color: var(--muted); }
footer p { margin: 4px 0; }
@media (max-width: 640px) {
  body { font-size: 16px; }
  .hero-in { grid-template-columns: 1fr; padding-top: 22px; }
  .hero-img { width: 100%; opacity: .22; }
  .layout { padding: 16px; }
  .card { padding: 16px; }
  .tf, .qact, .fb { margin-left: 0; }
  .tb-in { padding: 6px 16px; gap: 6px; }
  .chip { padding: 2px 9px; font-size: 13px; }
  .tbtn { padding: 4px 11px; font-size: 13px; }
  .tb-in .grow { display: none; }
}
.mc { display: grid; gap: 6px; margin: 10px 0 0 40px; }
.mc label { position: relative; display: block; }
.mc input { position: absolute; opacity: 0; inset: 0; }
.mc span { display: block; padding: 8px 14px; border: 2px solid var(--ink); border-radius: 14px; font-size: 15px; background: #fff; }
.mc.row { display: flex; flex-wrap: wrap; gap: 8px; }
.mc.row span { padding: 8px 16px; }
.mc input:checked + span { background: var(--ink); color: #fff; }
.bank { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 8px 0 12px; padding: 10px 14px; border: 2px dashed var(--ink); border-radius: 14px; font-weight: 700; }

/* Worksheet — print. Ink-saving: white paper, no filled blocks, colour only on thin lines and headings.
   Body classes set by the Print panel: .paper-a5 · .print-key (answer key) · .print-links (link + QR). */
@media print {
  *, *::before, *::after { background: transparent !important; box-shadow: none !important; text-shadow: none !important; }

  .print-only { display: block; }
  .hero { border: 0; border-bottom: 1.5pt solid var(--ink); }
  .hero-in { padding: 0 0 6pt; grid-template-columns: 1fr auto; max-width: none; }
  h1 { font-size: 26pt; max-width: none; }
  .paper-a5 h1 { font-size: 20pt; }
  .sub { font-size: 9pt; }
  .badge { border-width: 1pt; font-size: 8pt; padding: 0 6pt; }
  .badge.lv { color: var(--ink) !important; border: 1pt solid var(--ink); }
  .links { display: none !important; border: 1pt solid var(--ink); padding: 4pt 6pt; }
  .print-links .links:has(a) { display: flex !important; }
  .scr { display: none !important; }
  .links .qr { width: 22mm; height: 22mm; }
  .links p { font-size: 7.5pt; }
  .namerow { display: flex !important; gap: 18pt; margin: 6pt 0 0; font-size: 9pt; }
  .namerow span { flex: 1; border-bottom: .8pt solid #888; padding-bottom: 2pt; }
  .layout { display: block; padding: 0; max-width: none; }
  .read { position: static; max-height: none; overflow: visible; }

  .card h2 { font-size: 18pt; margin-bottom: 2pt; }
  .card h2 .num { width: 16pt; height: 16pt; font-size: 9pt; color: var(--acc); border: 1.2pt solid var(--acc); }
  .card .hint { font-size: 8.5pt; margin-bottom: 6pt; }
  .work { display: block; }

  .passage p { line-height: 1.55; margin-bottom: 5pt; padding-left: 18pt; }
  .passage p .pn { border: .8pt solid var(--acc); width: 13pt; height: 13pt; font-size: 7pt; top: 1pt; }
  mark.ev.on, .vw.on, .pp.on, .ck.flash { outline: 0 !important; }
  .words li, .pp-list li, .q { padding: 2pt 0; border: 0; border-radius: 0; margin: 0; break-inside: avoid; }
  .match { grid-template-columns: .8fr 1.2fr; gap: 10pt; display: grid; }
  .words, .defs { gap: 3pt; }
  .words select { appearance: none; -webkit-appearance: none; width: 18pt; height: 16pt; border: 1pt solid var(--ink); border-radius: 3pt; font-size: 9pt; padding: 0; }
  .words .mk, .q .mk { display: none; }
  .defs li { font-size: 9pt; }
  .defs .lt { width: 14pt; height: 14pt; font-size: 8pt; border-width: 1pt; }
  .row input, .gap input { border: 0 !important; border-bottom: .8pt dotted #555 !important; border-radius: 0; height: 16pt; }
  .row .btn, .fbs { display: none !important; }
  .row { margin-top: 1pt; }
  .tfbox { display: inline-block; min-width: 26mm; height: 14pt; border: 1pt solid var(--ink); border-radius: 3pt; margin-left: 30pt; padding: 0 4pt; font-weight: 800; font-size: 8.5pt; line-height: 13pt; }
  .q .qt { gap: 6pt; }
  .qn { min-width: 15pt; height: 15pt; font-size: 8pt; color: var(--ink); border: 1pt solid var(--ink); border-radius: 4pt; }
  .gap .qn { min-width: 13pt; height: 13pt; font-size: 7.5pt; }
  .notes { border: 1pt dashed var(--acc); padding: 6pt 10pt; }
  .notes h4 { font-size: 15pt; }
  .notes h5 { font-size: 9pt; margin: 6pt 0 2pt; }
  .gap input { width: 34mm; }
  .instr { font-size: 8.5pt; margin-bottom: 4pt; }
  .set + .set { margin-top: 10pt; }
  .print-key .key { display: block; break-before: page; }
  .key h2 { font: 400 18pt var(--hand); margin: 0 0 4pt; }
  .key h3 { font-size: 10pt; margin: 8pt 0 2pt; color: var(--acc); }
  .key ol { margin: 0; padding-left: 18pt; columns: 2; column-gap: 14pt; font-size: 8.5pt; }
  .key li { break-inside: avoid; margin-bottom: 3pt; }
  .key li b { color: var(--ink); }
  .key .why { color: #555; }
  footer { padding: 6pt 0 0; font-size: 7pt; max-width: none; }
  a { color: inherit; text-decoration: none; }
}

  function renderSet(set) {

    S.v[i] = v;
    li.classList.toggle('ok', !!v && W.defOrder[LT.indexOf(v)] === i);
    li.classList.toggle('no', !!v && W.defOrder[LT.indexOf(v)] !== i);
  }

  /* ---------- paraphrase ---------- */
  function checkPara(li, reveal) {
    const i = +li.dataset.i, p = W.para[i], inp = $('input', li), fb = $('.fbs', li);
    const a = noArt(norm(inp.value)), want = [p.a, ...(p.alt || [])].map(x => noArt(norm(x)));
    S.p[i] = inp.value;
    if (!a && !reveal) { li.classList.remove('ok', 'no'); fb.textContent = ''; return; }
    const ok = want.some(w => a === w || (a.includes(w) && a.split(' ').length - w.split(' ').length <= 2));
    li.classList.toggle('ok', ok); li.classList.toggle('no', !ok);
    li.tries = (li.tries || 0) + (ok ? 0 : 1);
    if (ok) { fb.textContent = `✓ Yes! “${p.q}” = “${p.a}”.`; showIn(`[data-pp="${i}"]`, '#' + p.c); }
    else if (reveal || li.tries >= 2) { fb.innerHTML = `Answer: “<b>${esc(p.a)}</b>”. <button class="see" type="button" data-sp="${i}">Show me</button>`; }
    else fb.textContent = 'Not quite. Try again, or press Hint.';
  }

  /* ---------- questions ---------- */
  const isRadio = t => t === 'TFNG' || t === 'YNNG' || t === 'MCQ' || t === 'MatchFeat';
  function readQ(n) {
    const q = $('#q' + n);
    if (isRadio(W.Q[n].t)) { const r = $('input:checked', q); return r ? r.value : ''; }
    return $('.gap input', q).value;
  }
  function checkQ(n, quiet) {
    const Q = W.Q[n], box = $('#q' + n), fb = $('.fb', box), val = readQ(n);
    S.q[n] = val;
    if (!val.trim()) { if (!quiet) { fb.innerHTML = '<p class="res">Write or choose an answer first.</p>'; } return; }
    S.done[n] = 1;
    const a = norm(val), ok = Q.a.some(x => norm(x) === a);
    box.classList.toggle('ok', ok); box.classList.toggle('no', !ok);
    let note = '';
    if (!ok && !isRadio(Q.t)) {
      if (Q.a.some(x => { const w = norm(x); return Math.abs(w.length - a.length) <= 1 && lev(w, a) <= 1 && w.length > 3; })) note = ' Very close — check the spelling or plural.';
      const lim = Q.limit; if (lim && a.split(' ').filter(w => !/^\d+$/.test(w)).length > lim) note += ` Remember: ${W.sets.find(s => n >= s.n[0] && n <= s.n[1]).rule}.`;
    }
    const L = Q.walk || {};
    fb.innerHTML = `<p class="res">${ok ? '✓ Correct!' : `✗ Not quite. Answer: ${esc(Q.a[0])}${Q.t === 'MCQ' || Q.t === 'MatchFeat' ? '. ' + esc(Q.o[Q.a[0]]) : ''}${Q.a.length > 1 && Q.t !== 'SumComp' ? ` (or ${esc(Q.a.slice(1).join(', '))})` : ''}.${note}`}</p>
      <p>${esc(Q.why)}</p>
      ${L.loc ? `<p><span class="tag loc">Locate</span>“${esc(L.loc.q)}”${L.loc.p && L.loc.p !== L.loc.q ? ` → “${esc(L.loc.p)}”` : ''}</p>` : ''}
      ${L.dec ? `<p><span class="tag dec">Decide</span>“${esc(L.dec.q)}”${L.dec.p ? ` → “${esc(L.dec.p)}”` : ' → nothing in the text'}</p>` : ''}
      ${L.break ? `<ul>${L.break.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}
      ${L.trap ? `<p><span class="tag trap">Trap</span>${esc(L.trap)}</p>` : ''}
      ${L.tip ? `<p><span class="tag tip">Tip</span>${esc(L.tip)}</p>` : ''}
      <button class="see" type="button" data-sq="${n}">${Q.ev ? 'Show the answer in the text' : 'Show the closest part of the text'}</button>`;
    const tb = $('.tfbox', box); if (tb) tb.textContent = val;
  }

  /* ---------- score / state ---------- */
  function score() {
    const q = W.questions.filter(x => $('#q' + x.n).classList.contains('ok')).length;
    const qd = Object.keys(S.done).length;
    const v = $$('.words li.ok').length, p = $$('.pp-list li.ok').length;
    $('#sc-q').textContent = $('#r-q').textContent = `${q}/${W.questions.length}`;
    $('#sc-v').textContent = $('#r-v').textContent = `${v}/${W.vocab.length}`;
    if (W.para.length) $('#sc-p').textContent = $('#r-p').textContent = `${p}/${W.para.length}`;
    const N = W.questions.length;
    $('#msg').textContent = qd < N ? `You have checked ${qd} of ${N} questions.`
      : q === N ? 'Perfect score! Try the next level.' : q >= N * .75 ? 'Great work! Read the explanations for the ones you missed.'
      : q >= N * .5 ? 'Good start. Go back to the text and look at the paraphrases.' : 'Keep going: watch the video again, then try once more.';
    store.set(S);
  }
  function fill(st) {
    for (const [i, v] of Object.entries(st.v || {})) { const li = $(`.words li[data-i="${i}"]`); if (li) { $('select', li).value = v; checkVocab(li); } }
    for (const [i, v] of Object.entries(st.p || {})) { const li = $(`.pp-list li[data-i="${i}"]`); if (li) { $('input', li).value = v; if (v) checkPara(li); } }
    for (const [n, v] of Object.entries(st.q || {})) {
      const box = $('#q' + n); if (!box || !W.Q[n]) continue;
      if (isRadio(W.Q[n].t)) { const r = $(`input[value="${v}"]`, box); if (r) r.checked = true; } else $('.gap input', box).value = v;
      if ((st.done || {})[n]) checkQ(+n, true);
    }
  }
  const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const dec = s => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/')))));

  /* ---------- events ---------- */
  document.addEventListener('change', e => {
    const li = e.target.closest('.words li'); if (li) { checkVocab(li); score(); return; }
    const q = e.target.closest('.q'); if (q && e.target.type === 'radio') { S.q[q.dataset.n] = e.target.value; store.set(S); }
  });
  document.addEventListener('input', e => {
    const q = e.target.closest('.q'); if (q) { S.q[q.dataset.n] = e.target.value; store.set(S); }
    const li = e.target.closest('.pp-list li'); if (li) { S.p[li.dataset.i] = e.target.value; store.set(S); }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
    const li = e.target.closest('.pp-list li'); if (li) { checkPara(li); score(); }
    const q = e.target.closest('.q'); if (q) { checkQ(+q.dataset.n); score(); }
  });
  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (d.see) showIn(`[data-v="${d.see}"]`, '#' + W.vocab[+d.see].c);
    else if (d.pc) { checkPara(b.closest('li')); score(); }
    else if (d.ph) showIn('#' + W.para[+d.ph].c);
    else if (d.sp) showIn(`[data-pp="${d.sp}"]`, '#' + W.para[+d.sp].c);
    else if (d.qc) { checkQ(+d.qc); score(); }
    else if (d.sq) showIn(`mark[data-q~="${d.sq}"]`, '#' + W.Q[d.sq].c);
    else if (d.sc) { const [a, z] = d.sc.split('-').map(Number); for (let n = a; n <= z; n++) checkQ(n, true); score(); }
  });
  $('#checkall').onclick = () => { W.questions.forEach(q => checkQ(q.n, true)); score(); };
  $('#reset').onclick = () => { if (!confirm('Clear all your answers?')) return; store.clear(); location.hash = ''; location.reload(); };
  $('#share').onclick = async () => {
    const url = location.href.split('#')[0] + '#r=' + enc(S);
    try { await navigator.clipboard.writeText(url); $('#share').textContent = 'Link copied ✓'; }
    catch { prompt('Copy this link:', url); }
    setTimeout(() => { $('#share').textContent = 'Copy result link'; }, 2500);
  };

  /* timer */
  let left = W.minutes * 60, tid = 0;
  const tbtn = $('#timer'), fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  tbtn.onclick = () => {
    if (tid) { clearInterval(tid); tid = 0; tbtn.classList.remove('run'); tbtn.textContent = `⏱ ${fmt(left)} Go on`; return; }
    if (left <= 0) left = W.minutes * 60;
    tbtn.classList.add('run'); tbtn.classList.remove('out');
    tid = setInterval(() => {
      left--; tbtn.textContent = `⏱ ${fmt(left)} Pause`;
      if (left <= 0) { clearInterval(tid); tid = 0; tbtn.classList.replace('run', 'out'); tbtn.textContent = "⏱ Time's up!"; }
    }, 1000);
    tbtn.textContent = `⏱ ${fmt(left)} Pause`;
  };

  /* print panel */
  const pg = document.createElement('style'); document.head.appendChild(pg);
  function paper() {
    const a5 = $('input[name="paper"]:checked').value === 'A5';
    document.body.classList.toggle('paper-a5', a5);
    document.body.classList.toggle('print-key', $('#pk').checked);
    document.body.classList.toggle('print-links', $('#pl').checked);
    pg.textContent = `@page { size: ${a5 ? 'A5' : 'A4'}; margin: ${a5 ? '9mm' : '12mm'}; }`;
  }
  $$('.printpanel input').forEach(i => i.addEventListener('change', paper));
  $('#doprint').onclick = () => { paper(); $('.printbox').open = false; window.print(); };
  const qs = new URLSearchParams(location.search);   // ?paper=A5&key=1&links=0 (used by scripts/print_worksheet.mjs)
  if (qs.get('paper') === 'A5') $('input[value="A5"]').checked = true;
  if (qs.get('key') === '1') $('#pk').checked = true;
  if (qs.get('links') === '0') $('#pl').checked = false;
  paper();

  /* QR code (video link if known, else this worksheet) */
  const qrUrl = W.links.video || W.links.worksheet;
  if (qrUrl) {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';
    s.onload = () => { try { const q = qrcode(0, 'M'); q.addData(qrUrl); q.make(); $('#qr').innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch { /* no QR */ } };
    document.head.appendChild(s);
  }

  /* restore */
  const m = location.hash.match(/^#r=(.+)$/);
  let saved = null;
  if (m) { try { saved = dec(m[1]); shared = true; $('#banner').innerHTML = '<div class="banner">You are looking at a shared result. Press “Start again” to try it yourself.</div>'; } catch { saved = null; } }
  fill(saved || store.get() || S);
  score();
})();

</script>
</body>
</html>
